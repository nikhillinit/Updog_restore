[extend]
useDefault = true

[[rules]]
id = "updog-negative-control-token"
description = "Updog secret-scanner negative control"
regex = '''UPDOG_NEGATIVE_CONTROL_TOKEN\s*=\s*updog_test_secret_[0-9a-f]{32}'''
keywords = ["updog_test_secret_"]

[[allowlists]]
description = "Allow historical Task 10 makeApp synthetic JWT fixture"
condition = "AND"
regexTarget = "line"
regexes = [
  '''process\.env\.JWT_SECRET\s*=\s*'ledger-surface-test-secret-32-chars-min';'''
]
paths = [
  '''^tests/unit/routes/investment-ledger-makeapp-surface\.contract\.test\.ts$'''
]

[[allowlists]]
description = "Allow deterministic Task 11 legacy-round idempotency fixture"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "line"
regexes = [
  '''^\s*idempotency_key:\s*'legacy-round-901',$'''
]
paths = [
  '''^tests/unit/services/investment-ledger/position-service\.test\.ts$'''
]

[[allowlists]]
description = "Allow F_1.7.0 S1 source-config route-surface test fixtures: synthetic JWT secret and deterministic idempotency keys"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "line"
regexes = [
  '''process\.env\.JWT_SECRET\s*=\s*'route-surface-test-secret-32-chars-min';''',
  '''\.set\('Idempotency-Key',\s*'route-v2-(?:happy|stale)'\)''',
]
paths = [
  '''^tests/unit/routes/fund-scenario-sets-source-config\.test\.ts$'''
]

[[allowlists]]
description = "Allow deterministic current-forecast shadow idempotency fixture"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "line"
regexes = [
  '''^\s*idempotencyKey:\s*'forecast-shadow-1',$'''
]
paths = [
  '''^tests/unit/services/fund-calculation-mode-service\.current-forecast\.test\.ts$'''
]

[[allowlists]]
description = "Allow deterministic database-health identity test fixture"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "line"
regexes = [
  '''(?m)^const healthKey = 'health-route-test-key-32-characters';$'''
]
paths = [
  '''^tests/unit/routes/database-health-identity\.test\.ts$'''
]

[[allowlists]]
description = "Surface-contract-matrix generated artifacts store sha256 content digests of tracked source files; path-like keys (auth.ts, lp-api.ts) plus 64-hex values trip generic-api-key but are hashes, not credentials"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "line"
regexes = [
  '''^\s*"[^"]{1,240}(?:=|":\s*")[0-9a-f]{64}",?$''',
  '''(?:^|[\s|])[^"\s|]{1,240}=[0-9a-f]{64}"?(?:\s|\||$)''',
  '''passkey boundary:\s*[0-9a-f]{64}''',
  '''passkey boundary:\s*[^"]{1,64}'''
]
paths = [
  '''^audit/surface-contract-matrix/(?:matrix|source-inventory)\.json$''',
  '''^audit/surface-contract-matrix/g1-review\.json$''',
  '''^audit/surface-contract-matrix/MATRIX\.md$'''
]

[[allowlists]]
description = "F1 runtime review records SHA-256 digests of these eight tracked source files"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "line"
regexes = [
  '''^\s*"(?:scripts/build-vercel-api\.mjs|server/lib/public-api-boundary\.ts|server/routes/(?:auth|lp-api(?:\.schemas)?|performance-api(?:\.schemas)?)\.ts|shared/routes/api-route-manifest\.ts)(?:":\s*"|=)[0-9a-f]{64}",?\s*$'''
]
paths = [
  '''^audit/surface-contract-matrix/f1-runtime-review-20260908\.json$'''
]

[[allowlists]]
description = "Allow historical negative-control fixture template from blocking repo-history scans"
targetRules = ["updog-negative-control-token"]
condition = "AND"
regexTarget = "line"
regexes = [
  '''^\s*UPDOG_NEGATIVE_CONTROL_TOKEN\s*=\s*updog_test_secret_[0-9a-f]{32}\s*$'''
]
paths = [
  '''^tests/fixtures/security/secret-scan-negative-control\.txt\.template$'''
]

[[allowlists]]
description = "Allow historical .mimosa hook-state baselines: content-addressed snapshots of tracked test sources (supertest/vitest fixtures with synthetic keys) accidentally committed in c20bbbd69; directory is gitignored and untracked since. Pinned to that exact commit AND the sha256-named baseline blob shape, so any later force-added file under .mimosa (a new commit) is NOT suppressed"
targetRules = ["generic-api-key"]
condition = "AND"
commits = ["c20bbbd69b6fb7c5409b3e72d59264ea55a418f7"]
paths = [
  '''^\.mimosa/hook-state/sess_[0-9a-f-]+\.[A-Za-z0-9.-]+\.baseline/[0-9a-f]{64}\.source$'''
]

[[allowlists]]
description = "Allow historical fund-scenario-sets synthetic JWT fixture (stale branch commit 3002f458e; file absent at HEAD)"
condition = "AND"
commits = ["3002f458e7ea0c7a4e91ff6c88595da30a49e5c6"]
regexTarget = "line"
regexes = [
  '''process\.env\.JWT_SECRET\s*=\s*'route-surface-test-secret-32-chars-min';'''
]
paths = [
  '''^tests/unit/routes/fund-scenario-sets-source-config\.test\.ts$'''
]

[[allowlists]]
description = "Allow historical fund-scenario-sets deterministic idempotency fixture (stale branch commit 3002f458e; file absent at HEAD)"
targetRules = ["generic-api-key"]
condition = "AND"
commits = ["3002f458e7ea0c7a4e91ff6c88595da30a49e5c6"]
regexTarget = "line"
regexes = [
  '''\.set\('Idempotency-Key',\s*'route-v2-happy'\)'''
]
paths = [
  '''^tests/unit/routes/fund-scenario-sets-source-config\.test\.ts$'''
]

[[allowlists]]
description = "Allow historical F_1.12.0 actuals runtime deterministic idempotency UUID fixture"
targetRules = ["generic-api-key"]
condition = "AND"
commits = ["ff234218538ade7486685348e37820e7b1161d36"]
regexTarget = "line"
regexes = [
  '''^\s*const KEY = 'c2c1984c-7382-4ff5-9f18-1fa89fbba54c';$'''
]
paths = [
  '''^tests/unit/server/actuals-pilot-runtime-routes\.test\.ts$'''
]

[[allowlists]]
description = "Allow connected actuals demo synthetic JWT fixture"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "line"
regexes = [
  '''(?m)^[ \t]*JWT_SECRET:[ \t]*'test-jwt-secret-must-be-at-least-32-characters-long-for-hs256-validation',[ \t]*$'''
]
paths = [
  '''^scripts/run-connected-actuals-demo\.mjs$'''
]
