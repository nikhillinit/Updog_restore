name: Release Production

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact current main SHA to release
        type: string
        required: true
      operator_evidence_b64:
        description: Base64-encoded redacted fund and capital worker health/readiness evidence
        type: string
        required: true
      baseline_evidence_b64:
        description: Base64-encoded exact pre-merge baseline identity (run, attempt, artifact, digests; rollback PR pair in rollback mode)
        type: string
        required: true
      release_mode:
        description: Governed release mode
        type: choice
        options:
          - primary
          - rollback
        required: true
      schema_apply_run_id:
        description: Schema apply workflow run ID
        type: string
        required: true
      schema_apply_run_attempt:
        description: Schema apply workflow run attempt
        type: choice
        options:
          - '1'
        required: true
      schema_apply_artifact_id:
        description: Schema apply evidence artifact ID
        type: string
        required: true
      schema_apply_artifact_digest:
        description: Schema apply evidence artifact digest
        type: string
        required: true
      schema_apply_receipt_file_sha256:
        description: SHA-256 of schema apply receipt file
        type: string
        required: true
      schema_precursor_sha:
        description: Schema-only precursor commit SHA
        type: string
        required: true
      pr_number:
        description: Pull request number whose merge produced expected_sha (required for primary)
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: release-production
  cancel-in-progress: false

jobs:
  production-mutation-block:
    name: Production Mutation Blocked
    runs-on: ubuntu-latest
    steps:
      - name: Fail closed while production mutation is unauthorized
        run: |
          echo "::error::Production release mutation is mechanically blocked."
          exit 1

  validate-target:
    name: Validate Production Target
    needs: production-mutation-block
    runs-on: ubuntu-latest
    outputs:
      log_window_start: ${{ steps.target.outputs.log_window_start }}
    steps:
      - name: Require exact current main SHA
        id: target
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          RELEASE_MODE: ${{ inputs.release_mode }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          # GitHub reruns are intentionally unsupported: failed-jobs reruns can
          # retain prior-attempt artifacts and all-jobs reruns share run-scoped
          # approval history. Recover, re-fence, and issue a fresh dispatch.
          if [[ "$GITHUB_RUN_ATTEMPT" != "1" ]]; then
            echo "Release Production supports fresh dispatch only; rerun attempts are rejected."
            exit 1
          fi
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Production release must be dispatched from main."
            exit 1
          fi
          if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ || "$GITHUB_SHA" != "$EXPECTED_SHA" ]]; then
            echo "expected_sha must equal the exact current main SHA."
            exit 1
          fi
          if [[ "$RELEASE_MODE" == "primary" && ! "$PR_NUMBER" =~ ^[1-9][0-9]{0,8}$ ]]; then
            echo "pr_number is required and must be valid for primary release mode."
            exit 1
          fi
          echo "log_window_start=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

  baseline-policy-preflight:
    name: Baseline Policy Preflight
    needs: validate-target
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: Production
    # The only job allowed to read protected provider IDs and residue policy
    # variables pre-mutation; pull-requests read proves exact PR head/merge
    # metadata. It performs no provider, database, or repository mutation.
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      baseline_artifact_id: ${{ steps.upload_baseline_fragment.outputs.artifact-id }}
      baseline_artifact_name: ${{ steps.fragment_meta.outputs.baseline_artifact_name }}
      baseline_artifact_digest: ${{ steps.upload_baseline_fragment.outputs.artifact-digest }}
      baseline_file_sha256: ${{ steps.build_baseline_fragment.outputs.file_sha256 }}
      baseline_payload_sha256: ${{ steps.build_baseline_fragment.outputs.payload_sha256 }}
      policy_config_artifact_id: ${{ steps.upload_policy_config_fragment.outputs.artifact-id }}
      policy_config_artifact_name: ${{ steps.fragment_meta.outputs.policy_config_artifact_name }}
      policy_config_artifact_digest: ${{ steps.upload_policy_config_fragment.outputs.artifact-digest }}
      policy_config_file_sha256: ${{ steps.build_policy_config_fragment.outputs.file_sha256 }}
      policy_config_payload_sha256: ${{ steps.build_policy_config_fragment.outputs.payload_sha256 }}
    steps:
      - name: Checkout exact release verifier
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.expected_sha }}

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env

      - name: Verify exact baseline artifact identity
        env:
          BASELINE_EVIDENCE_B64: ${{ inputs.baseline_evidence_b64 }}
          RELEASE_MODE: ${{ inputs.release_mode }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          : "${BASELINE_EVIDENCE_B64:?BASELINE_EVIDENCE_B64 is required}"
          : "${RELEASE_MODE:?RELEASE_MODE is required}"
          node scripts/release/capture-release-recovery-context.mjs verify-baseline-artifact \
            --baseline-evidence-b64 "$BASELINE_EVIDENCE_B64" \
            --release-mode "$RELEASE_MODE"

      - name: Download exact baseline artifact by ID
        env:
          BASELINE_EVIDENCE_B64: ${{ inputs.baseline_evidence_b64 }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ARTIFACT_ID="$(node -e 'const binding = JSON.parse(Buffer.from(process.env.BASELINE_EVIDENCE_B64 ?? "", "base64").toString("utf8")); const id = String(binding.baselineArtifactId ?? ""); if (!/^[1-9][0-9]{0,31}$/.test(id)) { console.error("baseline artifact ID is invalid"); process.exit(1); } console.log(id);')"
          gh api "repos/${REPO}/actions/artifacts/${ARTIFACT_ID}/zip" > "$RUNNER_TEMP/release-baseline.zip"
          unzip -o "$RUNNER_TEMP/release-baseline.zip" -d "$RUNNER_TEMP/release-baseline"
          test -f "$RUNNER_TEMP/release-baseline/release-recovery-context-v1.json"

      - name: Verify baseline consumption and release lineage
        env:
          BASELINE_EVIDENCE_B64: ${{ inputs.baseline_evidence_b64 }}
          RELEASE_MODE: ${{ inputs.release_mode }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          PR_NUMBER: ${{ inputs.pr_number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          : "${EXPECTED_SHA:?EXPECTED_SHA is required}"
          args=(
            --baseline-evidence-b64 "$BASELINE_EVIDENCE_B64"
            --release-mode "$RELEASE_MODE"
            --expected-sha "$EXPECTED_SHA"
            --context-file "$RUNNER_TEMP/release-baseline/release-recovery-context-v1.json"
            --emit-normalized "$RUNNER_TEMP/baseline-fragment-payload.json"
          )
          if [[ "$RELEASE_MODE" == "primary" ]]; then
            : "${PR_NUMBER:?PR_NUMBER is required for primary mode}"
            args+=(--pr-number "$PR_NUMBER")
          fi
          node scripts/release/capture-release-recovery-context.mjs verify-baseline-consumption \
            "${args[@]}"

      - name: Name attempt-qualified preflight fragment artifacts
        id: fragment_meta
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          echo "baseline_artifact_name=release-evidence-fragment-v1-baseline-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${EXPECTED_SHA}" >> "$GITHUB_OUTPUT"
          echo "policy_config_artifact_name=release-evidence-fragment-v1-policy-config-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${EXPECTED_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build baseline evidence fragment
        id: build_baseline_fragment
        env:
          FRAGMENT_SOURCE_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          BUILD_OUTPUT="$(npx tsx scripts/release/build-release-evidence-fragment.ts \
            --kind baseline \
            --payload-file "$RUNNER_TEMP/baseline-fragment-payload.json" \
            --producer-job baseline-policy-preflight \
            --output "$RUNNER_TEMP/release-evidence-fragment-baseline.json")"
          node -e '
            const parsed = JSON.parse(process.argv[1]);
            const hex = /^[a-f0-9]{64}$/;
            if (!hex.test(parsed.payloadSha256) || !hex.test(parsed.fileSha256)) {
              console.error("Baseline fragment builder emitted an invalid result.");
              process.exit(1);
            }
            const fs = require("node:fs");
            fs.appendFileSync(process.env.GITHUB_OUTPUT, "payload_sha256=" + parsed.payloadSha256 + "\n");
            fs.appendFileSync(process.env.GITHUB_OUTPUT, "file_sha256=" + parsed.fileSha256 + "\n");
          ' "$BUILD_OUTPUT"

      - name: Upload immutable baseline evidence fragment
        id: upload_baseline_fragment
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.fragment_meta.outputs.baseline_artifact_name }}
          path: ${{ runner.temp }}/release-evidence-fragment-baseline.json
          retention-days: 30
          if-no-files-found: error

      - name: Build policy-config evidence fragment
        id: build_policy_config_fragment
        env:
          FRAGMENT_SOURCE_SHA: ${{ inputs.expected_sha }}
          RELEASE_CANARY_MAX_PORTFOLIO_COMPANY_RESIDUE: ${{ vars.RELEASE_CANARY_MAX_PORTFOLIO_COMPANY_RESIDUE }}
          RELEASE_CANARY_MAX_FUND_RESIDUE: ${{ vars.RELEASE_CANARY_MAX_FUND_RESIDUE }}
          RELEASE_CANARY_MAX_FUND_CONFIG_RESIDUE: ${{ vars.RELEASE_CANARY_MAX_FUND_CONFIG_RESIDUE }}
          RELEASE_CANARY_MAX_FUND_EVENT_RESIDUE: ${{ vars.RELEASE_CANARY_MAX_FUND_EVENT_RESIDUE }}
          RELEASE_CANARY_MAX_NOTIFICATION_RESIDUE: ${{ vars.RELEASE_CANARY_MAX_NOTIFICATION_RESIDUE }}
          RELEASE_CANARY_MAX_GRANT_RESIDUE: ${{ vars.RELEASE_CANARY_MAX_GRANT_RESIDUE }}
          RELEASE_CANARY_MAX_CALCULATION_RESIDUE: ${{ vars.RELEASE_CANARY_MAX_CALCULATION_RESIDUE }}
          RELEASE_CANARY_MAX_MUTATION_RECEIPT_RESIDUE: ${{ vars.RELEASE_CANARY_MAX_MUTATION_RECEIPT_RESIDUE }}
          RELEASE_CANARY_MAX_SCENARIO_RESIDUE: ${{ vars.RELEASE_CANARY_MAX_SCENARIO_RESIDUE }}
          RELEASE_CANARY_MAX_REPORTING_RESIDUE: ${{ vars.RELEASE_CANARY_MAX_REPORTING_RESIDUE }}
          RELEASE_CANARY_MAX_TOTAL_RESIDUE: ${{ vars.RELEASE_CANARY_MAX_TOTAL_RESIDUE }}
          RELEASE_CANARY_TTL_HOURS: ${{ vars.RELEASE_CANARY_TTL_HOURS }}
        run: |
          set -euo pipefail
          : "${RELEASE_CANARY_MAX_PORTFOLIO_COMPANY_RESIDUE:?RELEASE_CANARY_MAX_PORTFOLIO_COMPANY_RESIDUE is required}"
          : "${RELEASE_CANARY_MAX_FUND_RESIDUE:?RELEASE_CANARY_MAX_FUND_RESIDUE is required}"
          : "${RELEASE_CANARY_MAX_FUND_CONFIG_RESIDUE:?RELEASE_CANARY_MAX_FUND_CONFIG_RESIDUE is required}"
          : "${RELEASE_CANARY_MAX_FUND_EVENT_RESIDUE:?RELEASE_CANARY_MAX_FUND_EVENT_RESIDUE is required}"
          : "${RELEASE_CANARY_MAX_NOTIFICATION_RESIDUE:?RELEASE_CANARY_MAX_NOTIFICATION_RESIDUE is required}"
          : "${RELEASE_CANARY_MAX_GRANT_RESIDUE:?RELEASE_CANARY_MAX_GRANT_RESIDUE is required}"
          : "${RELEASE_CANARY_MAX_CALCULATION_RESIDUE:?RELEASE_CANARY_MAX_CALCULATION_RESIDUE is required}"
          : "${RELEASE_CANARY_MAX_MUTATION_RECEIPT_RESIDUE:?RELEASE_CANARY_MAX_MUTATION_RECEIPT_RESIDUE is required}"
          : "${RELEASE_CANARY_MAX_SCENARIO_RESIDUE:?RELEASE_CANARY_MAX_SCENARIO_RESIDUE is required}"
          : "${RELEASE_CANARY_MAX_REPORTING_RESIDUE:?RELEASE_CANARY_MAX_REPORTING_RESIDUE is required}"
          : "${RELEASE_CANARY_MAX_TOTAL_RESIDUE:?RELEASE_CANARY_MAX_TOTAL_RESIDUE is required}"
          : "${RELEASE_CANARY_TTL_HOURS:?RELEASE_CANARY_TTL_HOURS is required}"
          # The helper script must live inside the workspace: ESM relative
          # imports resolve against the importing file's directory, so a
          # RUNNER_TEMP location cannot reach ./shared/contracts.
          cat > ./build-policy-config-payload.tmp.mts <<'BUILD'
          import { writeFileSync } from 'node:fs';
          import { RELEASE_CANARY_RESERVED_RESIDUE } from './shared/contracts/release-canary-residue-characterization-v1.contract';

          const capEnvByGroup = {
            portfolioCompany: 'RELEASE_CANARY_MAX_PORTFOLIO_COMPANY_RESIDUE',
            fund: 'RELEASE_CANARY_MAX_FUND_RESIDUE',
            fundConfig: 'RELEASE_CANARY_MAX_FUND_CONFIG_RESIDUE',
            fundEvent: 'RELEASE_CANARY_MAX_FUND_EVENT_RESIDUE',
            notification: 'RELEASE_CANARY_MAX_NOTIFICATION_RESIDUE',
            grant: 'RELEASE_CANARY_MAX_GRANT_RESIDUE',
            calculation: 'RELEASE_CANARY_MAX_CALCULATION_RESIDUE',
            mutationReceipt: 'RELEASE_CANARY_MAX_MUTATION_RECEIPT_RESIDUE',
            scenario: 'RELEASE_CANARY_MAX_SCENARIO_RESIDUE',
            reporting: 'RELEASE_CANARY_MAX_REPORTING_RESIDUE',
            total: 'RELEASE_CANARY_MAX_TOTAL_RESIDUE',
          } as const;
          const configuredCaps = Object.fromEntries(
            Object.entries(capEnvByGroup).map(([group, envName]) => {
              const raw = process.env[envName];
              if (raw === undefined || !/^(0|[1-9][0-9]{0,8})$/.test(raw)) {
                throw new Error(`${envName} must be a bounded non-negative integer`);
              }
              return [group, Number(raw)];
            })
          );
          const ttlRaw = process.env['RELEASE_CANARY_TTL_HOURS'];
          if (ttlRaw === undefined || !/^(0|[1-9][0-9]{0,8})$/.test(ttlRaw)) {
            throw new Error('RELEASE_CANARY_TTL_HOURS must be a bounded non-negative integer');
          }
          const payload = {
            reservedPerRun: RELEASE_CANARY_RESERVED_RESIDUE,
            configuredCaps,
            retainedRunBudget: 3,
            ttlHours: Number(ttlRaw),
          };
          writeFileSync(
            `${process.env['RUNNER_TEMP']}/policy-config-fragment-payload.json`,
            JSON.stringify(payload),
            { mode: 0o600 }
          );
          BUILD
          npx tsx ./build-policy-config-payload.tmp.mts
          rm -f ./build-policy-config-payload.tmp.mts
          BUILD_OUTPUT="$(npx tsx scripts/release/build-release-evidence-fragment.ts \
            --kind policy-config \
            --payload-file "$RUNNER_TEMP/policy-config-fragment-payload.json" \
            --producer-job baseline-policy-preflight \
            --output "$RUNNER_TEMP/release-evidence-fragment-policy-config.json")"
          node -e '
            const parsed = JSON.parse(process.argv[1]);
            const hex = /^[a-f0-9]{64}$/;
            if (!hex.test(parsed.payloadSha256) || !hex.test(parsed.fileSha256)) {
              console.error("Policy-config fragment builder emitted an invalid result.");
              process.exit(1);
            }
            const fs = require("node:fs");
            fs.appendFileSync(process.env.GITHUB_OUTPUT, "payload_sha256=" + parsed.payloadSha256 + "\n");
            fs.appendFileSync(process.env.GITHUB_OUTPUT, "file_sha256=" + parsed.fileSha256 + "\n");
          ' "$BUILD_OUTPUT"

      - name: Upload immutable policy-config evidence fragment
        id: upload_policy_config_fragment
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.fragment_meta.outputs.policy_config_artifact_name }}
          path: ${{ runner.temp }}/release-evidence-fragment-policy-config.json
          retention-days: 30
          if-no-files-found: error

      - name: Remove baseline context evidence
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/release-baseline.zip" "$RUNNER_TEMP/release-baseline" "$RUNNER_TEMP/baseline-fragment-payload.json" "$RUNNER_TEMP/release-evidence-fragment-baseline.json" "$RUNNER_TEMP/policy-config-fragment-payload.json" "$RUNNER_TEMP/release-evidence-fragment-policy-config.json" ./build-policy-config-payload.tmp.mts

  release-proof:
    name: Full Release Proof
    needs: validate-target
    # Exactly these three read permissions so the reusable proof cannot be
    # permission-downgraded below its exact-SHA checks; no write or global
    # permission broadening is allowed.
    permissions:
      actions: read
      checks: read
      contents: read
    uses: ./.github/workflows/release-proof.yml
    with:
      expected_sha: ${{ inputs.expected_sha }}
      # Candidate provider identity cannot exist before stage-production creates
      # its exact unaliased production-target deployment. This first gate proves
      # source/local evidence; staged-provider-identity owns provider proof.
      require_provider_identity: false
      proof_mode: certifying

  schema-audit:
    name: Clean Production Schema Audit
    needs: release-proof
    # contents plus actions read only: actions read exists solely for the
    # exact-ID historical apply artifact fetch inside the reusable audit.
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/prod-schema-reconcile.yml
    with:
      mode: audit
      expected_sha: ${{ inputs.expected_sha }}
      schema_apply_run_id: ${{ inputs.schema_apply_run_id }}
      schema_apply_run_attempt: ${{ inputs.schema_apply_run_attempt }}
      schema_apply_artifact_id: ${{ inputs.schema_apply_artifact_id }}
      schema_apply_artifact_digest: ${{ inputs.schema_apply_artifact_digest }}
      schema_apply_receipt_file_sha256: ${{ inputs.schema_apply_receipt_file_sha256 }}
      schema_precursor_sha: ${{ inputs.schema_precursor_sha }}
    secrets: inherit

  stage-production:
    name: Create Staged Production Deployment
    if: ${{ false }}
    needs: [release-proof, schema-audit, baseline-policy-preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: Production
    outputs:
      deployment_url: ${{ steps.deploy.outputs.deployment_url }}
    steps:
      - name: Require attempt 1 and successful proof prerequisites before mutation
        env:
          RELEASE_PROOF_RESULT: ${{ needs.release-proof.result }}
          SCHEMA_AUDIT_RESULT: ${{ needs.schema-audit.result }}
          BASELINE_POLICY_PREFLIGHT_RESULT: ${{ needs.baseline-policy-preflight.result }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_RUN_ATTEMPT" != "1" ]]; then
            echo "::error::Staging is only permitted on workflow attempt 1; reruns are unsupported."
            exit 1
          fi
          if [[ "$RELEASE_PROOF_RESULT" != "success" || "$SCHEMA_AUDIT_RESULT" != "success" || "$BASELINE_POLICY_PREFLIGHT_RESULT" != "success" ]]; then
            echo "::error::Staging requires release-proof, schema-audit, and baseline-policy-preflight to all succeed."
            exit 1
          fi

      - name: Re-fence live main before staging
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if ! LIVE_MAIN="$(gh api "repos/${REPO}/commits/main" --jq '.sha')"; then
            echo "::error::Could not resolve live main HEAD; refusing to stage (fail-closed)."
            exit 1
          fi
          if [[ ! "$LIVE_MAIN" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Unexpected live main SHA '${LIVE_MAIN}'; refusing to stage (fail-closed)."
            exit 1
          fi
          if [[ "$LIVE_MAIN" != "$EXPECTED_SHA" ]]; then
            echo "::error::main advanced from ${EXPECTED_SHA} to ${LIVE_MAIN} during this release run; refusing to stage a stale target. Re-dispatch Release Production for the current main SHA."
            exit 1
          fi
          echo "Live main still equals release target ${EXPECTED_SHA}; staging authorized."

      - name: Checkout exact release commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.expected_sha }}

      - name: Setup Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'

      - name: Verify checked-out release commit
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          if [[ "$ACTUAL_SHA" != "$EXPECTED_SHA" || "$GITHUB_SHA" != "$EXPECTED_SHA" ]]; then
            echo "::error::Checked-out SHA does not match expected_sha."
            exit 1
          fi

      - name: Create staged production deployment
        id: deploy
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          : "${VERCEL_TOKEN:?VERCEL_TOKEN is required}"
          : "${VERCEL_ORG_ID:?VERCEL_ORG_ID is required}"
          : "${VERCEL_PROJECT_ID:?VERCEL_PROJECT_ID is required}"
          npx --yes vercel@55.0.0 build --prod --yes
          DEPLOYMENT_URL="$(
            npx --yes vercel@55.0.0 deploy \
              --prebuilt \
              --prod \
              --skip-domain \
              --yes \
              --meta githubDeployment=1 \
              --meta githubCommitRef=main \
              --meta "githubCommitSha=${EXPECTED_SHA}"
          )"
          export DEPLOYMENT_URL
          node <<'NODE'
          const fs = require('node:fs');
          const raw = process.env.DEPLOYMENT_URL ?? '';
          const validShape =
            /^https:\/\/[a-z0-9](?:[a-z0-9-]*[a-z0-9])?\.vercel\.app$/.test(raw);
          if (!validShape) {
            console.error('Vercel deploy must return one bare HTTPS vercel.app deployment URL.');
            process.exit(1);
          }
          const url = new URL(raw);
          const validUrl =
            url.protocol === 'https:' &&
            url.username === '' &&
            url.password === '' &&
            url.port === '' &&
            url.pathname === '/' &&
            url.search === '' &&
            url.hash === '';
          if (!validUrl) {
            console.error('Staged deployment URL failed strict validation.');
            process.exit(1);
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `deployment_url=${raw}\n`);
          console.log('Staged production deployment created.');
          NODE

  validate-deployment:
    name: Validate Staged Deployment Identity
    needs: stage-production
    if: ${{ success() && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: Production
    outputs:
      deployment_url: ${{ steps.verify.outputs.deployment_url }}
      deployment_id: ${{ steps.verify.outputs.deployment_id }}
    steps:
      - name: Re-fence live main before validation
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if ! LIVE_MAIN="$(gh api "repos/${REPO}/commits/main" --jq '.sha')"; then
            echo "::error::Could not resolve live main HEAD; refusing to proceed (fail-closed)."
            exit 1
          fi
          if [[ ! "$LIVE_MAIN" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Unexpected live main SHA '${LIVE_MAIN}'; refusing to proceed (fail-closed)."
            exit 1
          fi
          if [[ "$LIVE_MAIN" != "$EXPECTED_SHA" ]]; then
            echo "::error::main advanced from ${EXPECTED_SHA} to ${LIVE_MAIN} during this release run; refusing to proceed with a stale target. Re-dispatch Release Production for the current main SHA."
            exit 1
          fi
          echo "Live main still equals release target ${EXPECTED_SHA}; proceeding."

      - name: Normalize and verify exact staged deployment
        id: verify
        env:
          DEPLOYMENT_URL: ${{ needs.stage-production.outputs.deployment_url }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: |
          : "${VERCEL_TOKEN:?VERCEL_TOKEN is required}"
          : "${VERCEL_ORG_ID:?VERCEL_ORG_ID is required}"
          : "${VERCEL_PROJECT_ID:?VERCEL_PROJECT_ID is required}"
          node <<'NODE'
          const fs = require('node:fs');
          const url = new URL(process.env.DEPLOYMENT_URL);
          const host = url.hostname.toLowerCase();
          const validHost = /^[a-z0-9](?:[a-z0-9-]*[a-z0-9])?\.vercel\.app$/.test(host);
          const validUrl =
            url.protocol === 'https:' &&
            url.username === '' &&
            url.password === '' &&
            url.port === '' &&
            url.pathname === '/' &&
            url.search === '' &&
            url.hash === '' &&
            validHost;
          if (!validUrl) {
            console.error('deployment_url must be a bare HTTPS vercel.app deployment URL.');
            process.exit(1);
          }
          fs.writeFileSync(`${process.env.RUNNER_TEMP}/vercel-deployment-host.txt`, host);
          NODE
          DEPLOYMENT_HOST="$(cat "$RUNNER_TEMP/vercel-deployment-host.txt")"
          curl --fail --silent --show-error \
            --header "Authorization: Bearer ${VERCEL_TOKEN}" \
            "https://api.vercel.com/v13/deployments/${DEPLOYMENT_HOST}?teamId=${VERCEL_ORG_ID}" \
            --output "$RUNNER_TEMP/vercel-deployment.json"
          node <<'NODE'
          const fs = require('node:fs');
          const deployment = JSON.parse(
            fs.readFileSync(`${process.env.RUNNER_TEMP}/vercel-deployment.json`, 'utf8')
          );
          const requestedHost = fs
            .readFileSync(`${process.env.RUNNER_TEMP}/vercel-deployment-host.txt`, 'utf8')
            .trim();
          const deploymentHost = String(deployment.url ?? '').toLowerCase();
          const valid =
            deployment.readyState === 'READY' &&
            deployment.target === 'production' &&
            (deployment.alias ?? []).length === 0 &&
            deployment.projectId === process.env.VERCEL_PROJECT_ID &&
            deployment.meta?.githubCommitSha === process.env.EXPECTED_SHA &&
            deployment.meta?.githubCommitRef === 'main' &&
            deployment.meta?.githubDeployment === '1' &&
            deploymentHost === requestedHost;
          if (!valid || typeof deployment.id !== 'string' || !/^[A-Za-z0-9_-]{1,128}$/.test(deployment.id)) {
            console.error('Staged deployment does not match the exact production release target.');
            process.exit(1);
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `deployment_url=https://${deploymentHost}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `deployment_id=${deployment.id}\n`);
          console.log('Staged deployment identity verified.');
          NODE

  railway-workers-verify:
    name: Verify Railway Worker Topology
    needs: validate-deployment
    if: ${{ success() && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: Production
    steps:
      - name: Checkout exact release verifier
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.expected_sha }}

      - name: Setup Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'

      - name: Wait for exact Railway worker topology
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ vars.RAILWAY_ENVIRONMENT_ID }}
          RAILWAY_FUND_SCENARIO_CALC_SERVICE_ID: ${{ vars.RAILWAY_FUND_SCENARIO_CALC_SERVICE_ID }}
          RAILWAY_CAPITAL_CALL_STATUS_SERVICE_ID: ${{ vars.RAILWAY_CAPITAL_CALL_STATUS_SERVICE_ID }}
        run: |
          set -euo pipefail
          : "${EXPECTED_SHA:?EXPECTED_SHA is required}"
          : "${RAILWAY_TOKEN:?RAILWAY_TOKEN is required}"
          : "${RAILWAY_PROJECT_ID:?RAILWAY_PROJECT_ID is required}"
          : "${RAILWAY_ENVIRONMENT_ID:?RAILWAY_ENVIRONMENT_ID is required}"
          : "${RAILWAY_FUND_SCENARIO_CALC_SERVICE_ID:?RAILWAY_FUND_SCENARIO_CALC_SERVICE_ID is required}"
          : "${RAILWAY_CAPITAL_CALL_STATUS_SERVICE_ID:?RAILWAY_CAPITAL_CALL_STATUS_SERVICE_ID is required}"
          node scripts/release/wait-railway-workers.mjs \
            --expected-sha "$EXPECTED_SHA" \
            --expected-railway-project-id "$RAILWAY_PROJECT_ID" \
            --expected-railway-environment-id "$RAILWAY_ENVIRONMENT_ID" \
            --expected-fund-scenario-service-id "$RAILWAY_FUND_SCENARIO_CALC_SERVICE_ID" \
            --expected-capital-call-service-id "$RAILWAY_CAPITAL_CALL_STATUS_SERVICE_ID"

  staged-smoke:
    name: Authenticated Staged Production Smoke
    # Direct needs on baseline-policy-preflight and release-proof let the
    # ratification approval template consume exact config/characterization
    # outputs rather than inaccessible transitive needs.
    needs: [baseline-policy-preflight, release-proof, validate-deployment, railway-workers-verify]
    if: ${{ needs.baseline-policy-preflight.result == 'success' && needs.release-proof.result == 'success' && needs.validate-deployment.result == 'success' && needs.railway-workers-verify.result == 'success' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    # Job budget = pre-canary steps (checkout, npm ci, playwright install,
    # staged smoke: realistically 5-8 min) + the 12-minute release-canary step
    # bound + finalizer margin. The STEP timeout must be the binding bound so
    # a hung canary yields outcome=failure (not a job-level cancellation) and
    # the always() residue finalizer still runs with time to spare.
    timeout-minutes: 25
    environment: Production
    outputs:
      policy_measurement_artifact_id: ${{ steps.upload_policy_measurement_fragment.outputs.artifact-id }}
      policy_measurement_artifact_name: ${{ steps.smoke_fragment_meta.outputs.policy_measurement_artifact_name }}
      policy_measurement_artifact_digest: ${{ steps.upload_policy_measurement_fragment.outputs.artifact-digest }}
      policy_measurement_file_sha256: ${{ steps.build_policy_measurement_fragment.outputs.file_sha256 }}
      policy_measurement_payload_sha256: ${{ steps.build_policy_measurement_fragment.outputs.payload_sha256 }}
      canary_result_artifact_id: ${{ steps.upload_canary_result_fragment.outputs.artifact-id }}
      canary_result_artifact_name: ${{ steps.smoke_fragment_meta.outputs.canary_result_artifact_name }}
      canary_result_artifact_digest: ${{ steps.upload_canary_result_fragment.outputs.artifact-digest }}
      canary_result_file_sha256: ${{ steps.build_canary_result_fragment.outputs.file_sha256 }}
      canary_result_payload_sha256: ${{ steps.build_canary_result_fragment.outputs.payload_sha256 }}
    steps:
      - name: Require attempt 1 before staged mutation
        run: |
          set -euo pipefail
          if [[ "$GITHUB_RUN_ATTEMPT" != "1" ]]; then
            echo "::error::Staged smoke is only permitted on workflow attempt 1; reruns are unsupported."
            exit 1
          fi

      - name: Re-fence live main before staged smoke
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if ! LIVE_MAIN="$(gh api "repos/${REPO}/commits/main" --jq '.sha')"; then
            echo "::error::Could not resolve live main HEAD; refusing to proceed (fail-closed)."
            exit 1
          fi
          if [[ ! "$LIVE_MAIN" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Unexpected live main SHA '${LIVE_MAIN}'; refusing to proceed (fail-closed)."
            exit 1
          fi
          if [[ "$LIVE_MAIN" != "$EXPECTED_SHA" ]]; then
            echo "::error::main advanced from ${EXPECTED_SHA} to ${LIVE_MAIN} during this release run; refusing to proceed with a stale target. Re-dispatch Release Production for the current main SHA."
            exit 1
          fi
          echo "Live main still equals release target ${EXPECTED_SHA}; proceeding."

      - name: Checkout exact release commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.expected_sha }}

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env

      - name: Require non-skippable smoke credentials
        env:
          PRODUCTION_URL: ${{ needs.validate-deployment.outputs.deployment_url }}
          HEALTH_KEY: ${{ secrets.HEALTH_KEY }}
          METRICS_KEY: ${{ secrets.METRICS_KEY }}
          PROD_SMOKE_USERNAME: ${{ secrets.PROD_SMOKE_USERNAME }}
          PROD_SMOKE_PASSWORD: ${{ secrets.PROD_SMOKE_PASSWORD }}
          CANARY_USERNAME: ${{ secrets.CANARY_USERNAME }}
          CANARY_PASSWORD: ${{ secrets.CANARY_PASSWORD }}
          CANARY_RECONCILER_USERNAME: ${{ secrets.CANARY_RECONCILER_USERNAME }}
          CANARY_RECONCILER_PASSWORD: ${{ secrets.CANARY_RECONCILER_PASSWORD }}
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          RUM_ALLOWED_ORIGIN: https://${{ vars.VERCEL_PRODUCTION_HOSTNAME }}
        run: |
          : "${PRODUCTION_URL:?PRODUCTION_URL is required}"
          : "${HEALTH_KEY:?HEALTH_KEY is required}"
          : "${METRICS_KEY:?METRICS_KEY is required}"
          : "${PROD_SMOKE_USERNAME:?PROD_SMOKE_USERNAME is required}"
          : "${PROD_SMOKE_PASSWORD:?PROD_SMOKE_PASSWORD is required}"
          : "${CANARY_USERNAME:?CANARY_USERNAME is required}"
          : "${CANARY_PASSWORD:?CANARY_PASSWORD is required}"
          : "${CANARY_RECONCILER_USERNAME:?CANARY_RECONCILER_USERNAME is required}"
          : "${CANARY_RECONCILER_PASSWORD:?CANARY_RECONCILER_PASSWORD is required}"
          if [ "$CANARY_RECONCILER_USERNAME" = "$CANARY_USERNAME" ]; then
            echo "CANARY_RECONCILER_USERNAME must differ from CANARY_USERNAME" >&2
            exit 1
          fi
          : "${DATABASE_URL:?DATABASE_URL is required}"
          : "${VERCEL_AUTOMATION_BYPASS_SECRET:?VERCEL_AUTOMATION_BYPASS_SECRET is required}"
          : "${RUM_ALLOWED_ORIGIN:?RUM_ALLOWED_ORIGIN is required}"

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Assert staged Vercel runtime canary policy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          : "${VERCEL_TOKEN:?VERCEL_TOKEN is required}"
          : "${VERCEL_ORG_ID:?VERCEL_ORG_ID is required}"
          : "${VERCEL_PROJECT_ID:?VERCEL_PROJECT_ID is required}"
          env_json="$RUNNER_TEMP/vercel-canary-policy.json"
          trap 'rm -f "$env_json"' EXIT
          curl --fail --silent --show-error --request GET \
            --header "Authorization: Bearer ${VERCEL_TOKEN}" \
            "https://api.vercel.com/v10/projects/${VERCEL_PROJECT_ID}/env?teamId=${VERCEL_ORG_ID}" \
            --output "$env_json"
          VERCEL_ENV_JSON="$env_json" node <<'NODE'
          const fs = require('node:fs');

          const requiredKeys = [
            'RELEASE_CANARY_MAX_PORTFOLIO_COMPANY_RESIDUE',
            'RELEASE_CANARY_MAX_FUND_RESIDUE',
            'RELEASE_CANARY_MAX_FUND_CONFIG_RESIDUE',
            'RELEASE_CANARY_MAX_FUND_EVENT_RESIDUE',
            'RELEASE_CANARY_MAX_NOTIFICATION_RESIDUE',
            'RELEASE_CANARY_MAX_GRANT_RESIDUE',
            'RELEASE_CANARY_MAX_CALCULATION_RESIDUE',
            'RELEASE_CANARY_MAX_MUTATION_RECEIPT_RESIDUE',
            'RELEASE_CANARY_MAX_SCENARIO_RESIDUE',
            'RELEASE_CANARY_MAX_REPORTING_RESIDUE',
            'RELEASE_CANARY_MAX_TOTAL_RESIDUE',
            'RELEASE_CANARY_TTL_HOURS',
          ];
          const payload = JSON.parse(fs.readFileSync(process.env.VERCEL_ENV_JSON, 'utf8'));
          const productionKeys = new Set(
            (Array.isArray(payload.envs) ? payload.envs : [])
              .filter(
                (entry) => Array.isArray(entry?.target) && entry.target.includes('production')
              )
              .map((entry) => entry.key)
              .filter((key) => typeof key === 'string')
          );
          const missingKeys = requiredKeys.filter((key) => !productionKeys.has(key));
          if (missingKeys.length > 0) {
            console.error(
              `Missing production canary policy keys: ${missingKeys.join(', ')}`
            );
            process.exit(1);
          }
          for (const key of requiredKeys) {
            console.log(`Verified production canary policy key: ${key}`);
          }
          NODE

      - name: Run authenticated staged smoke
        env:
          PRODUCTION_URL: ${{ needs.validate-deployment.outputs.deployment_url }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          HEALTH_KEY: ${{ secrets.HEALTH_KEY }}
          METRICS_KEY: ${{ secrets.METRICS_KEY }}
          PROD_SMOKE_USERNAME: ${{ secrets.PROD_SMOKE_USERNAME }}
          PROD_SMOKE_PASSWORD: ${{ secrets.PROD_SMOKE_PASSWORD }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          RUM_ALLOWED_ORIGIN: https://${{ vars.VERCEL_PRODUCTION_HOSTNAME }}
        run: |
          set -euo pipefail
          : "${EXPECTED_SHA:?EXPECTED_SHA is required}"
          npx playwright test tests/smoke/production-boundaries.spec.ts --project=production --reporter=line

      - name: Prepare release canary execution window
        id: canary_window
        run: |
          set -euo pipefail
          CANARY_STARTED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          RESULT_PATH="$RUNNER_TEMP/release-canary-recovery-handle-v1.json"
          H9_METADATA_PATH="$RUNNER_TEMP/release-canary-h9-metadata-v1.json"
          rm -f "$RESULT_PATH" "$H9_METADATA_PATH"
          {
            echo "canary_started_at=$CANARY_STARTED_AT"
            echo "result_path=$RESULT_PATH"
            echo "h9_metadata_path=$H9_METADATA_PATH"
          } >> "$GITHUB_OUTPUT"

      # continue-on-error lets the always-on finalizer bind the exact run to a
      # terminal state; the finalizer re-fails the job on canary failure. The
      # step timeout keeps a hung canary bounded INSIDE the 25-minute job
      # budget (pre-canary steps + this bound + finalizer margin) so the
      # always() residue finalizer retains margin to classify the timeout as a
      # current-run failure (a timed-out step yields outcome=failure).
      - name: Run release canaries
        id: release_canaries
        timeout-minutes: 12
        continue-on-error: true
        env:
          PRODUCTION_URL: ${{ needs.validate-deployment.outputs.deployment_url }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          CANARY_USERNAME: ${{ secrets.CANARY_USERNAME }}
          CANARY_PASSWORD: ${{ secrets.CANARY_PASSWORD }}
          CANARY_RECONCILER_USERNAME: ${{ secrets.CANARY_RECONCILER_USERNAME }}
          CANARY_RECONCILER_PASSWORD: ${{ secrets.CANARY_RECONCILER_PASSWORD }}
          CANARY_STARTED_AT: ${{ steps.canary_window.outputs.canary_started_at }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          RELEASE_CANARY_RESULT_PATH: ${{ steps.canary_window.outputs.result_path }}
          RELEASE_CANARY_H9_METADATA_PATH: ${{ steps.canary_window.outputs.h9_metadata_path }}
        run: |
          set -euo pipefail
          : "${PRODUCTION_URL:?PRODUCTION_URL is required}"
          : "${EXPECTED_SHA:?EXPECTED_SHA is required}"
          : "${CANARY_USERNAME:?CANARY_USERNAME is required}"
          : "${CANARY_PASSWORD:?CANARY_PASSWORD is required}"
          : "${CANARY_RECONCILER_USERNAME:?CANARY_RECONCILER_USERNAME is required}"
          : "${CANARY_RECONCILER_PASSWORD:?CANARY_RECONCILER_PASSWORD is required}"
          : "${CANARY_STARTED_AT:?CANARY_STARTED_AT is required}"
          : "${VERCEL_AUTOMATION_BYPASS_SECRET:?VERCEL_AUTOMATION_BYPASS_SECRET is required}"
          : "${RELEASE_CANARY_RESULT_PATH:?RELEASE_CANARY_RESULT_PATH is required}"
          : "${RELEASE_CANARY_H9_METADATA_PATH:?RELEASE_CANARY_H9_METADATA_PATH is required}"
          # retries=0: whole-suite retries would mint a new canary fund and
          # spend another reserved residue vector; request-level retries inside
          # the spec remain bounded and idempotent.
          npx playwright test tests/smoke/release-canaries.spec.ts --project=production --reporter=line --retries=0

      - name: Assert bounded canary residue
        # Always-on finalizer: proves the exact current execution created the
        # canary run, transitions only that run, then evaluates the global
        # caps. The CLI evaluates caps from the runner's process.env via the
        # shared readCanaryRuntimePolicy; ADR-076 makes GitHub Production
        # variables the injected source of truth (the earlier step asserts the
        # staged Vercel runtime carries the same keys).
        if: always()
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          RELEASE_CANARY_RESULT_PATH: ${{ steps.canary_window.outputs.result_path }}
          CANARY_STARTED_AT: ${{ steps.canary_window.outputs.canary_started_at }}
          PLAYWRIGHT_OUTCOME: ${{ steps.release_canaries.outcome }}
          RELEASE_CANARY_MAX_PORTFOLIO_COMPANY_RESIDUE: ${{ vars.RELEASE_CANARY_MAX_PORTFOLIO_COMPANY_RESIDUE }}
          RELEASE_CANARY_MAX_FUND_RESIDUE: ${{ vars.RELEASE_CANARY_MAX_FUND_RESIDUE }}
          RELEASE_CANARY_MAX_FUND_CONFIG_RESIDUE: ${{ vars.RELEASE_CANARY_MAX_FUND_CONFIG_RESIDUE }}
          RELEASE_CANARY_MAX_FUND_EVENT_RESIDUE: ${{ vars.RELEASE_CANARY_MAX_FUND_EVENT_RESIDUE }}
          RELEASE_CANARY_MAX_NOTIFICATION_RESIDUE: ${{ vars.RELEASE_CANARY_MAX_NOTIFICATION_RESIDUE }}
          RELEASE_CANARY_MAX_GRANT_RESIDUE: ${{ vars.RELEASE_CANARY_MAX_GRANT_RESIDUE }}
          RELEASE_CANARY_MAX_CALCULATION_RESIDUE: ${{ vars.RELEASE_CANARY_MAX_CALCULATION_RESIDUE }}
          RELEASE_CANARY_MAX_MUTATION_RECEIPT_RESIDUE: ${{ vars.RELEASE_CANARY_MAX_MUTATION_RECEIPT_RESIDUE }}
          RELEASE_CANARY_MAX_SCENARIO_RESIDUE: ${{ vars.RELEASE_CANARY_MAX_SCENARIO_RESIDUE }}
          RELEASE_CANARY_MAX_REPORTING_RESIDUE: ${{ vars.RELEASE_CANARY_MAX_REPORTING_RESIDUE }}
          RELEASE_CANARY_MAX_TOTAL_RESIDUE: ${{ vars.RELEASE_CANARY_MAX_TOTAL_RESIDUE }}
          RELEASE_CANARY_TTL_HOURS: ${{ vars.RELEASE_CANARY_TTL_HOURS }}
        run: |
          set -euo pipefail
          : "${DATABASE_URL:?DATABASE_URL is required}"
          : "${EXPECTED_SHA:?EXPECTED_SHA is required}"
          : "${RELEASE_CANARY_MAX_PORTFOLIO_COMPANY_RESIDUE:?RELEASE_CANARY_MAX_PORTFOLIO_COMPANY_RESIDUE is required}"
          : "${RELEASE_CANARY_MAX_FUND_RESIDUE:?RELEASE_CANARY_MAX_FUND_RESIDUE is required}"
          : "${RELEASE_CANARY_MAX_FUND_CONFIG_RESIDUE:?RELEASE_CANARY_MAX_FUND_CONFIG_RESIDUE is required}"
          : "${RELEASE_CANARY_MAX_FUND_EVENT_RESIDUE:?RELEASE_CANARY_MAX_FUND_EVENT_RESIDUE is required}"
          : "${RELEASE_CANARY_MAX_NOTIFICATION_RESIDUE:?RELEASE_CANARY_MAX_NOTIFICATION_RESIDUE is required}"
          : "${RELEASE_CANARY_MAX_GRANT_RESIDUE:?RELEASE_CANARY_MAX_GRANT_RESIDUE is required}"
          : "${RELEASE_CANARY_MAX_CALCULATION_RESIDUE:?RELEASE_CANARY_MAX_CALCULATION_RESIDUE is required}"
          : "${RELEASE_CANARY_MAX_MUTATION_RECEIPT_RESIDUE:?RELEASE_CANARY_MAX_MUTATION_RECEIPT_RESIDUE is required}"
          : "${RELEASE_CANARY_MAX_SCENARIO_RESIDUE:?RELEASE_CANARY_MAX_SCENARIO_RESIDUE is required}"
          : "${RELEASE_CANARY_MAX_REPORTING_RESIDUE:?RELEASE_CANARY_MAX_REPORTING_RESIDUE is required}"
          : "${RELEASE_CANARY_MAX_TOTAL_RESIDUE:?RELEASE_CANARY_MAX_TOTAL_RESIDUE is required}"
          : "${RELEASE_CANARY_TTL_HOURS:?RELEASE_CANARY_TTL_HOURS is required}"
          : "${RELEASE_CANARY_RESULT_PATH:?RELEASE_CANARY_RESULT_PATH is required}"
          : "${CANARY_STARTED_AT:?CANARY_STARTED_AT is required}"
          : "${PLAYWRIGHT_OUTCOME:?PLAYWRIGHT_OUTCOME is required}"
          if [ ! -f "$RELEASE_CANARY_RESULT_PATH" ]; then
            echo "::error::Release canary recovery handle is missing; failing closed with no run transition. Never search for a latest run."
            exit 1
          fi
          HANDLE_FIELDS="$(node -e '
            const fs = require("node:fs");
            const handle = JSON.parse(fs.readFileSync(process.env.RELEASE_CANARY_RESULT_PATH, "utf8"));
            const uuid = /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i;
            const valid =
              handle && typeof handle === "object" &&
              handle.schemaVersion === "release-canary-recovery-handle-v1" &&
              handle.githubRunId === process.env.GITHUB_RUN_ID &&
              String(handle.githubRunAttempt) === process.env.GITHUB_RUN_ATTEMPT &&
              handle.releaseSha === process.env.EXPECTED_SHA &&
              Number.isSafeInteger(handle.fundId) && handle.fundId >= 1 &&
              typeof handle.canaryRunId === "string" && uuid.test(handle.canaryRunId);
            if (!valid) {
              console.error("Release canary recovery handle does not match this exact workflow execution.");
              process.exit(1);
            }
            console.log(handle.fundId + " " + handle.canaryRunId);
          ')"
          read -r RELEASE_CANARY_FUND_ID RELEASE_CANARY_RUN_ID <<< "$HANDLE_FIELDS"
          if [ "$PLAYWRIGHT_OUTCOME" = "success" ]; then
            TRANSITION_FLAG="--complete-current-run"
          else
            TRANSITION_FLAG="--fail-current-run"
          fi
          node scripts/release/assert-canary-residue.mjs \
            --expected-sha "$EXPECTED_SHA" \
            --expected-fund-id "$RELEASE_CANARY_FUND_ID" \
            --expected-canary-run-id "$RELEASE_CANARY_RUN_ID" \
            --github-run-id "$GITHUB_RUN_ID" \
            --github-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --started-at "$CANARY_STARTED_AT" \
            --max-clock-skew-seconds 300 \
            --emit-result "$RUNNER_TEMP/release-canary-residue-result.json" \
            "$TRANSITION_FLAG"
          if [ "$PLAYWRIGHT_OUTCOME" != "success" ]; then
            echo "::error::Release canaries failed; the exact run was finalized as failed."
            exit 1
          fi

      - name: Name attempt-qualified staged-smoke fragment artifacts
        id: smoke_fragment_meta
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          echo "policy_measurement_artifact_name=release-evidence-fragment-v1-policy-measurement-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${EXPECTED_SHA}" >> "$GITHUB_OUTPUT"
          echo "canary_result_artifact_name=release-evidence-fragment-v1-canary-result-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${EXPECTED_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build policy-measurement evidence fragment
        id: build_policy_measurement_fragment
        env:
          FRAGMENT_SOURCE_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const result = JSON.parse(
            fs.readFileSync(`${process.env.RUNNER_TEMP}/release-canary-residue-result.json`, 'utf8')
          );
          fs.writeFileSync(
            `${process.env.RUNNER_TEMP}/policy-measurement-fragment-payload.json`,
            JSON.stringify({ residue: result.residue }),
            { mode: 0o600 }
          );
          NODE
          BUILD_OUTPUT="$(npx tsx scripts/release/build-release-evidence-fragment.ts \
            --kind policy-measurement \
            --payload-file "$RUNNER_TEMP/policy-measurement-fragment-payload.json" \
            --producer-job staged-smoke \
            --output "$RUNNER_TEMP/release-evidence-fragment-policy-measurement.json")"
          node -e '
            const parsed = JSON.parse(process.argv[1]);
            const hex = /^[a-f0-9]{64}$/;
            if (!hex.test(parsed.payloadSha256) || !hex.test(parsed.fileSha256)) {
              console.error("Policy-measurement fragment builder emitted an invalid result.");
              process.exit(1);
            }
            const fs = require("node:fs");
            fs.appendFileSync(process.env.GITHUB_OUTPUT, "payload_sha256=" + parsed.payloadSha256 + "\n");
            fs.appendFileSync(process.env.GITHUB_OUTPUT, "file_sha256=" + parsed.fileSha256 + "\n");
          ' "$BUILD_OUTPUT"

      - name: Upload immutable policy-measurement evidence fragment
        id: upload_policy_measurement_fragment
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.smoke_fragment_meta.outputs.policy_measurement_artifact_name }}
          path: ${{ runner.temp }}/release-evidence-fragment-policy-measurement.json
          retention-days: 30
          if-no-files-found: error

      - name: Build canary-result evidence fragment
        id: build_canary_result_fragment
        env:
          FRAGMENT_SOURCE_SHA: ${{ inputs.expected_sha }}
          CANARY_STARTED_AT: ${{ steps.canary_window.outputs.canary_started_at }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const temp = process.env.RUNNER_TEMP;
          const result = JSON.parse(
            fs.readFileSync(`${temp}/release-canary-residue-result.json`, 'utf8')
          );
          const h9 = JSON.parse(
            fs.readFileSync(`${temp}/release-canary-h9-metadata-v1.json`, 'utf8')
          );
          const payload = {
            execution: {
              fundId: result.fundId,
              canaryRunId: result.canaryRunId,
              githubRunId: result.githubRunId,
              githubRunAttempt: result.githubRunAttempt,
              releaseSha: result.expectedSha,
              startedAt: process.env.CANARY_STARTED_AT,
            },
            status: 'completed',
            residue: result.residue,
            h9Artifact: {
              recordId: h9.recordId,
              packageId: h9.packageId,
              contentHash: h9.contentHash,
              fingerprint: h9.fingerprint,
              sizeBytes: h9.sizeBytes,
            },
          };
          fs.writeFileSync(
            `${temp}/canary-result-fragment-payload.json`,
            JSON.stringify(payload),
            { mode: 0o600 }
          );
          NODE
          BUILD_OUTPUT="$(npx tsx scripts/release/build-release-evidence-fragment.ts \
            --kind canary-result \
            --payload-file "$RUNNER_TEMP/canary-result-fragment-payload.json" \
            --producer-job staged-smoke \
            --output "$RUNNER_TEMP/release-evidence-fragment-canary-result.json")"
          node -e '
            const parsed = JSON.parse(process.argv[1]);
            const hex = /^[a-f0-9]{64}$/;
            if (!hex.test(parsed.payloadSha256) || !hex.test(parsed.fileSha256)) {
              console.error("Canary-result fragment builder emitted an invalid result.");
              process.exit(1);
            }
            const fs = require("node:fs");
            fs.appendFileSync(process.env.GITHUB_OUTPUT, "payload_sha256=" + parsed.payloadSha256 + "\n");
            fs.appendFileSync(process.env.GITHUB_OUTPUT, "file_sha256=" + parsed.fileSha256 + "\n");
          ' "$BUILD_OUTPUT"

      - name: Upload immutable canary-result evidence fragment
        id: upload_canary_result_fragment
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.smoke_fragment_meta.outputs.canary_result_artifact_name }}
          path: ${{ runner.temp }}/release-evidence-fragment-canary-result.json
          retention-days: 30
          if-no-files-found: error

      - name: Remove staged-smoke fragment evidence
        if: always()
        run: rm -f -- "$RUNNER_TEMP/release-canary-residue-result.json" "$RUNNER_TEMP/release-canary-h9-metadata-v1.json" "$RUNNER_TEMP/policy-measurement-fragment-payload.json" "$RUNNER_TEMP/release-evidence-fragment-policy-measurement.json" "$RUNNER_TEMP/canary-result-fragment-payload.json" "$RUNNER_TEMP/release-evidence-fragment-canary-result.json"

  staged-provider-identity:
    name: Reverify Staged Provider Identity
    # Waiter dependency: the one-shot topology recheck must not race a worker
    # rollout that railway-workers-verify would have converged on.
    needs: [validate-deployment, railway-workers-verify]
    if: ${{ success() && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: Production
    outputs:
      deployment_url: ${{ needs.validate-deployment.outputs.deployment_url }}
    steps:
      - name: Checkout exact release verifier
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.expected_sha }}

      - name: Collect and verify exact staged provider evidence before promotion
        env:
          CANDIDATE_SHA: ${{ inputs.expected_sha }}
          DEPLOYMENT_URL: ${{ needs.validate-deployment.outputs.deployment_url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ vars.RAILWAY_ENVIRONMENT_ID }}
          RAILWAY_FUND_SCENARIO_CALC_SERVICE_ID: ${{ vars.RAILWAY_FUND_SCENARIO_CALC_SERVICE_ID }}
          RAILWAY_CAPITAL_CALL_STATUS_SERVICE_ID: ${{ vars.RAILWAY_CAPITAL_CALL_STATUS_SERVICE_ID }}
        run: |
          set -euo pipefail
          : "${VERCEL_TOKEN:?VERCEL_TOKEN is required}"
          : "${RAILWAY_TOKEN:?RAILWAY_TOKEN is required}"
          : "${VERCEL_AUTOMATION_BYPASS_SECRET:?VERCEL_AUTOMATION_BYPASS_SECRET is required}"
          : "${VERCEL_ORG_ID:?VERCEL_ORG_ID is required}"
          : "${VERCEL_PROJECT_ID:?VERCEL_PROJECT_ID is required}"
          : "${RAILWAY_PROJECT_ID:?RAILWAY_PROJECT_ID is required}"
          : "${RAILWAY_ENVIRONMENT_ID:?RAILWAY_ENVIRONMENT_ID is required}"
          : "${RAILWAY_FUND_SCENARIO_CALC_SERVICE_ID:?RAILWAY_FUND_SCENARIO_CALC_SERVICE_ID is required}"
          : "${RAILWAY_CAPITAL_CALL_STATUS_SERVICE_ID:?RAILWAY_CAPITAL_CALL_STATUS_SERVICE_ID is required}"
          provider_evidence_dir="$RUNNER_TEMP/provider-evidence-staged-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$provider_evidence_dir"
          node scripts/release/collect-provider-evidence.mjs \
            --deployment-url "$DEPLOYMENT_URL" \
            --output-dir "$provider_evidence_dir"
          node scripts/release/verify-provider-identity.mjs \
            --mode workflow \
            --expected-sha "$CANDIDATE_SHA" \
            --vercel "$provider_evidence_dir/vercel-evidence.json" \
            --railway "$provider_evidence_dir/railway-evidence.json" \
            --expected-vercel-project-id "$VERCEL_PROJECT_ID" \
            --expected-railway-project-id "$RAILWAY_PROJECT_ID" \
            --expected-railway-environment-id "$RAILWAY_ENVIRONMENT_ID" \
            --expected-fund-scenario-service-id "$RAILWAY_FUND_SCENARIO_CALC_SERVICE_ID" \
            --expected-capital-call-service-id "$RAILWAY_CAPITAL_CALL_STATUS_SERVICE_ID"

      - name: Remove staged provider evidence
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/provider-evidence-staged-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

  g4-operator-evidence:
    name: G4 Attested Operator Evidence Verification
    needs: [staged-provider-identity, railway-workers-verify]
    if: ${{ success() && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: Production
    outputs:
      operator_evidence_artifact_id: ${{ steps.upload_operator_evidence_fragment.outputs.artifact-id }}
      operator_evidence_artifact_name: ${{ steps.operator_fragment_meta.outputs.artifact_name }}
      operator_evidence_artifact_digest: ${{ steps.upload_operator_evidence_fragment.outputs.artifact-digest }}
      operator_evidence_file_sha256: ${{ steps.build_operator_evidence_fragment.outputs.file_sha256 }}
      operator_evidence_payload_sha256: ${{ steps.build_operator_evidence_fragment.outputs.payload_sha256 }}
    steps:
      - name: Checkout exact release verifier
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.expected_sha }}

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env

      - name: Decode attested operator evidence
        id: decode_operator_evidence
        env:
          OPERATOR_EVIDENCE_B64: ${{ inputs.operator_evidence_b64 }}
        run: |
          set -euo pipefail
          CAPTURED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          OPERATOR_EVIDENCE_B64="$OPERATOR_EVIDENCE_B64" \
            node scripts/release/operator-evidence-bundle.mjs decode \
            --output-dir "$RUNNER_TEMP/operator-evidence"
          BUNDLE_SHA256="$(printf '%s' "$OPERATOR_EVIDENCE_B64" | base64 -d | sha256sum | cut -d' ' -f1)"
          echo "captured_at=$CAPTURED_AT" >> "$GITHUB_OUTPUT"
          echo "bundle_sha256=$BUNDLE_SHA256" >> "$GITHUB_OUTPUT"

      - name: Collect and verify fresh staged provider evidence
        env:
          CANDIDATE_SHA: ${{ inputs.expected_sha }}
          DEPLOYMENT_URL: ${{ needs.staged-provider-identity.outputs.deployment_url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ vars.RAILWAY_ENVIRONMENT_ID }}
          RAILWAY_FUND_SCENARIO_CALC_SERVICE_ID: ${{ vars.RAILWAY_FUND_SCENARIO_CALC_SERVICE_ID }}
          RAILWAY_CAPITAL_CALL_STATUS_SERVICE_ID: ${{ vars.RAILWAY_CAPITAL_CALL_STATUS_SERVICE_ID }}
        run: |
          set -euo pipefail
          : "${VERCEL_TOKEN:?VERCEL_TOKEN is required}"
          : "${RAILWAY_TOKEN:?RAILWAY_TOKEN is required}"
          : "${VERCEL_AUTOMATION_BYPASS_SECRET:?VERCEL_AUTOMATION_BYPASS_SECRET is required}"
          : "${VERCEL_ORG_ID:?VERCEL_ORG_ID is required}"
          : "${VERCEL_PROJECT_ID:?VERCEL_PROJECT_ID is required}"
          : "${RAILWAY_PROJECT_ID:?RAILWAY_PROJECT_ID is required}"
          : "${RAILWAY_ENVIRONMENT_ID:?RAILWAY_ENVIRONMENT_ID is required}"
          : "${RAILWAY_FUND_SCENARIO_CALC_SERVICE_ID:?RAILWAY_FUND_SCENARIO_CALC_SERVICE_ID is required}"
          : "${RAILWAY_CAPITAL_CALL_STATUS_SERVICE_ID:?RAILWAY_CAPITAL_CALL_STATUS_SERVICE_ID is required}"
          provider_evidence_dir="$RUNNER_TEMP/provider-evidence-g4-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$provider_evidence_dir"
          node scripts/release/collect-provider-evidence.mjs \
            --deployment-url "$DEPLOYMENT_URL" \
            --output-dir "$provider_evidence_dir"
          node scripts/release/verify-provider-identity.mjs \
            --mode operator \
            --expected-sha "$CANDIDATE_SHA" \
            --vercel "$provider_evidence_dir/vercel-evidence.json" \
            --railway "$provider_evidence_dir/railway-evidence.json" \
            --expected-vercel-project-id "$VERCEL_PROJECT_ID" \
            --expected-railway-project-id "$RAILWAY_PROJECT_ID" \
            --expected-railway-environment-id "$RAILWAY_ENVIRONMENT_ID" \
            --expected-fund-scenario-service-id "$RAILWAY_FUND_SCENARIO_CALC_SERVICE_ID" \
            --expected-capital-call-service-id "$RAILWAY_CAPITAL_CALL_STATUS_SERVICE_ID" \
            --fund-health "$RUNNER_TEMP/operator-evidence/fund-health.json" \
            --fund-ready "$RUNNER_TEMP/operator-evidence/fund-ready.json" \
            --capital-health "$RUNNER_TEMP/operator-evidence/capital-health.json" \
            --capital-ready "$RUNNER_TEMP/operator-evidence/capital-ready.json"

      - name: Verify and publish attested operator evidence
        env:
          CANDIDATE_SHA: ${{ inputs.expected_sha }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ vars.RAILWAY_ENVIRONMENT_ID }}
          RAILWAY_FUND_SCENARIO_CALC_SERVICE_ID: ${{ vars.RAILWAY_FUND_SCENARIO_CALC_SERVICE_ID }}
          RAILWAY_CAPITAL_CALL_STATUS_SERVICE_ID: ${{ vars.RAILWAY_CAPITAL_CALL_STATUS_SERVICE_ID }}
        run: |
          set -euo pipefail
          node scripts/release/verify-provider-identity.mjs \
            --mode operator \
            --expected-sha "$CANDIDATE_SHA" \
            --vercel "$RUNNER_TEMP/provider-evidence-g4-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/vercel-evidence.json" \
            --railway "$RUNNER_TEMP/provider-evidence-g4-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/railway-evidence.json" \
            --expected-vercel-project-id "$VERCEL_PROJECT_ID" \
            --expected-railway-project-id "$RAILWAY_PROJECT_ID" \
            --expected-railway-environment-id "$RAILWAY_ENVIRONMENT_ID" \
            --expected-fund-scenario-service-id "$RAILWAY_FUND_SCENARIO_CALC_SERVICE_ID" \
            --expected-capital-call-service-id "$RAILWAY_CAPITAL_CALL_STATUS_SERVICE_ID" \
            --fund-health "$RUNNER_TEMP/operator-evidence/fund-health.json" \
            --fund-ready "$RUNNER_TEMP/operator-evidence/fund-ready.json" \
            --capital-health "$RUNNER_TEMP/operator-evidence/capital-health.json" \
            --capital-ready "$RUNNER_TEMP/operator-evidence/capital-ready.json" \
            | tee "$RUNNER_TEMP/operator-verification.json"
          {
            echo '### G4 attested operator evidence verification'
            echo '```json'
            cat "$RUNNER_TEMP/operator-verification.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Name attempt-qualified operator-evidence fragment artifact
        id: operator_fragment_meta
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          echo "artifact_name=release-evidence-fragment-v1-operator-evidence-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${EXPECTED_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build operator-evidence fragment
        id: build_operator_evidence_fragment
        env:
          FRAGMENT_SOURCE_SHA: ${{ inputs.expected_sha }}
          BUNDLE_SHA256: ${{ steps.decode_operator_evidence.outputs.bundle_sha256 }}
          CAPTURED_AT: ${{ steps.decode_operator_evidence.outputs.captured_at }}
        run: |
          set -euo pipefail
          : "${BUNDLE_SHA256:?BUNDLE_SHA256 is required}"
          : "${CAPTURED_AT:?CAPTURED_AT is required}"
          VERIFIED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          VERIFIED_AT="$VERIFIED_AT" node -e '
            const fs = require("node:fs");
            const payload = {
              bundleSha256: process.env.BUNDLE_SHA256,
              capturedAt: process.env.CAPTURED_AT,
              verifiedAt: process.env.VERIFIED_AT,
            };
            fs.writeFileSync(
              process.env.RUNNER_TEMP + "/operator-evidence-fragment-payload.json",
              JSON.stringify(payload),
              { mode: 0o600 }
            );
          '
          BUILD_OUTPUT="$(npx tsx scripts/release/build-release-evidence-fragment.ts \
            --kind operator-evidence \
            --payload-file "$RUNNER_TEMP/operator-evidence-fragment-payload.json" \
            --producer-job g4-operator-evidence \
            --output "$RUNNER_TEMP/release-evidence-fragment-operator-evidence.json")"
          node -e '
            const parsed = JSON.parse(process.argv[1]);
            const hex = /^[a-f0-9]{64}$/;
            if (!hex.test(parsed.payloadSha256) || !hex.test(parsed.fileSha256)) {
              console.error("Operator-evidence fragment builder emitted an invalid result.");
              process.exit(1);
            }
            const fs = require("node:fs");
            fs.appendFileSync(process.env.GITHUB_OUTPUT, "payload_sha256=" + parsed.payloadSha256 + "\n");
            fs.appendFileSync(process.env.GITHUB_OUTPUT, "file_sha256=" + parsed.fileSha256 + "\n");
          ' "$BUILD_OUTPUT"

      - name: Upload immutable operator-evidence fragment
        id: upload_operator_evidence_fragment
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.operator_fragment_meta.outputs.artifact_name }}
          path: ${{ runner.temp }}/release-evidence-fragment-operator-evidence.json
          retention-days: 30
          if-no-files-found: error

      - name: Remove decoded operator evidence
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/operator-evidence" "$RUNNER_TEMP/operator-evidence-fragment-payload.json" "$RUNNER_TEMP/release-evidence-fragment-operator-evidence.json"

      - name: Remove G4 provider evidence
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/provider-evidence-g4-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

  promote:
    name: Promote Staged Vercel Deployment
    if: ${{ false }}
    needs: [staged-smoke, validate-deployment, staged-provider-identity, g4-operator-evidence]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: Production
    outputs:
      production_url: ${{ steps.canonical-proof.outputs.production_url }}
      deployment_id: ${{ steps.canonical-proof.outputs.deployment_id }}
      release_provider_artifact_id: ${{ steps.upload_release_provider_fragment.outputs.artifact-id }}
      release_provider_artifact_name: ${{ steps.promote_fragment_meta.outputs.artifact_name }}
      release_provider_artifact_digest: ${{ steps.upload_release_provider_fragment.outputs.artifact-digest }}
      release_provider_file_sha256: ${{ steps.build_release_provider_fragment.outputs.file_sha256 }}
      release_provider_payload_sha256: ${{ steps.build_release_provider_fragment.outputs.payload_sha256 }}
    steps:
      - name: Require attempt 1 and successful prerequisites before promotion
        env:
          STAGED_SMOKE_RESULT: ${{ needs.staged-smoke.result }}
          VALIDATE_DEPLOYMENT_RESULT: ${{ needs.validate-deployment.result }}
          STAGED_PROVIDER_IDENTITY_RESULT: ${{ needs.staged-provider-identity.result }}
          G4_OPERATOR_EVIDENCE_RESULT: ${{ needs.g4-operator-evidence.result }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_RUN_ATTEMPT" != "1" ]]; then
            echo "::error::Promotion is only permitted on workflow attempt 1; reruns are unsupported."
            exit 1
          fi
          if [[ "$STAGED_SMOKE_RESULT" != "success" || "$VALIDATE_DEPLOYMENT_RESULT" != "success" || "$STAGED_PROVIDER_IDENTITY_RESULT" != "success" || "$G4_OPERATOR_EVIDENCE_RESULT" != "success" ]]; then
            echo "::error::Promotion requires staged-smoke, validate-deployment, staged-provider-identity, and g4-operator-evidence to all succeed."
            exit 1
          fi

      - name: Checkout exact release verifier
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.expected_sha }}

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env

      - name: Re-fence live main before promotion
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if ! LIVE_MAIN="$(gh api "repos/${REPO}/commits/main" --jq '.sha')"; then
            echo "::error::Could not resolve live main HEAD; refusing to promote (fail-closed)."
            exit 1
          fi
          if [[ ! "$LIVE_MAIN" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Unexpected live main SHA '${LIVE_MAIN}'; refusing to promote (fail-closed)."
            exit 1
          fi
          if [[ "$LIVE_MAIN" != "$EXPECTED_SHA" ]]; then
            echo "::error::main advanced from ${EXPECTED_SHA} to ${LIVE_MAIN} during this release run; refusing to promote a stale deployment. Re-dispatch Release Production for the current main SHA."
            exit 1
          fi
          echo "Live main still equals release target ${EXPECTED_SHA}; promotion authorized."

      - name: Re-decode attested operator evidence after approval
        env:
          OPERATOR_EVIDENCE_B64: ${{ inputs.operator_evidence_b64 }}
        run: |
          set -euo pipefail
          OPERATOR_EVIDENCE_B64="$OPERATOR_EVIDENCE_B64" \
            node scripts/release/operator-evidence-bundle.mjs decode \
            --output-dir "$RUNNER_TEMP/operator-evidence-promote"

      - name: Collect and verify fresh provider evidence before promotion
        env:
          CANDIDATE_SHA: ${{ inputs.expected_sha }}
          DEPLOYMENT_URL: ${{ needs.validate-deployment.outputs.deployment_url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ vars.RAILWAY_ENVIRONMENT_ID }}
          RAILWAY_FUND_SCENARIO_CALC_SERVICE_ID: ${{ vars.RAILWAY_FUND_SCENARIO_CALC_SERVICE_ID }}
          RAILWAY_CAPITAL_CALL_STATUS_SERVICE_ID: ${{ vars.RAILWAY_CAPITAL_CALL_STATUS_SERVICE_ID }}
        run: |
          set -euo pipefail
          : "${CANDIDATE_SHA:?CANDIDATE_SHA is required}"
          : "${VERCEL_TOKEN:?VERCEL_TOKEN is required}"
          : "${VERCEL_ORG_ID:?VERCEL_ORG_ID is required}"
          : "${VERCEL_PROJECT_ID:?VERCEL_PROJECT_ID is required}"
          : "${RAILWAY_TOKEN:?RAILWAY_TOKEN is required}"
          : "${VERCEL_AUTOMATION_BYPASS_SECRET:?VERCEL_AUTOMATION_BYPASS_SECRET is required}"
          : "${RAILWAY_PROJECT_ID:?RAILWAY_PROJECT_ID is required}"
          : "${RAILWAY_ENVIRONMENT_ID:?RAILWAY_ENVIRONMENT_ID is required}"
          : "${RAILWAY_FUND_SCENARIO_CALC_SERVICE_ID:?RAILWAY_FUND_SCENARIO_CALC_SERVICE_ID is required}"
          : "${RAILWAY_CAPITAL_CALL_STATUS_SERVICE_ID:?RAILWAY_CAPITAL_CALL_STATUS_SERVICE_ID is required}"
          provider_evidence_dir="$RUNNER_TEMP/provider-evidence-promote-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          export PROVIDER_EVIDENCE_DIR="$provider_evidence_dir"
          timeout --signal=TERM 2m bash -s <<'PROVIDER_CHECK'
            set -euo pipefail
            mkdir -p "$PROVIDER_EVIDENCE_DIR"
            node scripts/release/collect-provider-evidence.mjs \
              --deployment-url "$DEPLOYMENT_URL" \
              --output-dir "$PROVIDER_EVIDENCE_DIR"
            node scripts/release/verify-provider-identity.mjs \
              --mode operator \
              --expected-sha "$CANDIDATE_SHA" \
              --vercel "$PROVIDER_EVIDENCE_DIR/vercel-evidence.json" \
              --railway "$PROVIDER_EVIDENCE_DIR/railway-evidence.json" \
              --expected-vercel-project-id "$VERCEL_PROJECT_ID" \
              --expected-railway-project-id "$RAILWAY_PROJECT_ID" \
              --expected-railway-environment-id "$RAILWAY_ENVIRONMENT_ID" \
              --expected-fund-scenario-service-id "$RAILWAY_FUND_SCENARIO_CALC_SERVICE_ID" \
              --expected-capital-call-service-id "$RAILWAY_CAPITAL_CALL_STATUS_SERVICE_ID" \
              --fund-health "$RUNNER_TEMP/operator-evidence-promote/fund-health.json" \
              --fund-ready "$RUNNER_TEMP/operator-evidence-promote/fund-ready.json" \
              --capital-health "$RUNNER_TEMP/operator-evidence-promote/capital-health.json" \
              --capital-ready "$RUNNER_TEMP/operator-evidence-promote/capital-ready.json"
          PROVIDER_CHECK

      - name: Promote verified deployment
        id: promote-cli
        env:
          DEPLOYMENT_URL: ${{ needs.validate-deployment.outputs.deployment_url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          : "${DEPLOYMENT_URL:?DEPLOYMENT_URL is required}"
          : "${VERCEL_ORG_ID:?VERCEL_ORG_ID is required}"
          : "${VERCEL_PROJECT_ID:?VERCEL_PROJECT_ID is required}"
          set +e
          npx --yes vercel@55.0.0 promote "$DEPLOYMENT_URL" --yes --timeout=5m
          promote_exit=$?
          set -e
          echo "promote_exit=$promote_exit" >> "$GITHUB_OUTPUT"
          if [[ "$promote_exit" -eq 0 ]]; then
            echo "Vercel promote command completed; canonical proof is still required."
          else
            echo "Vercel promote command failed; canonical proof is required before accepting a no-op."
          fi

      - name: Resolve and prove canonical Vercel promotion
        id: canonical-proof
        env:
          VERCEL_PRODUCTION_HOSTNAME: ${{ vars.VERCEL_PRODUCTION_HOSTNAME }}
          EXPECTED_DEPLOYMENT_ID: ${{ needs.validate-deployment.outputs.deployment_id }}
          EXPECTED_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
        run: |
          set -euo pipefail
          : "${VERCEL_PRODUCTION_HOSTNAME:?VERCEL_PRODUCTION_HOSTNAME is required}"
          : "${EXPECTED_DEPLOYMENT_ID:?EXPECTED_DEPLOYMENT_ID is required}"
          : "${EXPECTED_PROJECT_ID:?EXPECTED_PROJECT_ID is required}"
          : "${EXPECTED_SHA:?EXPECTED_SHA is required}"
          : "${VERCEL_TOKEN:?VERCEL_TOKEN is required}"
          : "${VERCEL_ORG_ID:?VERCEL_ORG_ID is required}"
          timeout --signal=TERM 6m node scripts/release/verify-vercel-promotion.mjs \
            --canonical-hostname "$VERCEL_PRODUCTION_HOSTNAME" \
            --expected-deployment-id "$EXPECTED_DEPLOYMENT_ID" \
            --expected-project-id "$EXPECTED_PROJECT_ID" \
            --expected-sha "$EXPECTED_SHA" \
            --github-output "$GITHUB_OUTPUT"

      - name: Accept promote failure only with canonical no-op proof
        env:
          PROMOTE_EXIT: ${{ steps.promote-cli.outputs.promote_exit }}
          EXPECTED_DEPLOYMENT_ID: ${{ needs.validate-deployment.outputs.deployment_id }}
          PROVED_DEPLOYMENT_ID: ${{ steps.canonical-proof.outputs.deployment_id }}
        run: |
          set -euo pipefail
          : "${PROMOTE_EXIT:?PROMOTE_EXIT is required}"
          : "${EXPECTED_DEPLOYMENT_ID:?EXPECTED_DEPLOYMENT_ID is required}"
          : "${PROVED_DEPLOYMENT_ID:?PROVED_DEPLOYMENT_ID is required}"
          if [[ "$PROMOTE_EXIT" -ne 0 ]]; then
            if [[ "$PROVED_DEPLOYMENT_ID" != "$EXPECTED_DEPLOYMENT_ID" ]]; then
              echo "::error::Vercel promote failure lacks exact staged deployment canonical proof."
              exit 1
            fi
            echo "Vercel promote failure accepted only as verified canonical no-op."
          fi

      - name: Name attempt-qualified release-provider fragment artifact
        id: promote_fragment_meta
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          echo "artifact_name=release-evidence-fragment-v1-release-provider-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${EXPECTED_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build release-provider evidence fragment
        id: build_release_provider_fragment
        env:
          FRAGMENT_SOURCE_SHA: ${{ inputs.expected_sha }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_PRODUCTION_HOSTNAME: ${{ vars.VERCEL_PRODUCTION_HOSTNAME }}
          PROVED_DEPLOYMENT_ID: ${{ steps.canonical-proof.outputs.deployment_id }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ vars.RAILWAY_ENVIRONMENT_ID }}
          RAILWAY_FUND_SCENARIO_CALC_SERVICE_ID: ${{ vars.RAILWAY_FUND_SCENARIO_CALC_SERVICE_ID }}
          RAILWAY_CAPITAL_CALL_STATUS_SERVICE_ID: ${{ vars.RAILWAY_CAPITAL_CALL_STATUS_SERVICE_ID }}
        run: |
          set -euo pipefail
          : "${PROVED_DEPLOYMENT_ID:?PROVED_DEPLOYMENT_ID is required}"
          node <<'NODE'
          const fs = require('node:fs');
          const temp = process.env.RUNNER_TEMP;
          const railwayEvidence = JSON.parse(
            fs.readFileSync(
              `${temp}/provider-evidence-promote-${process.env.GITHUB_RUN_ID}-${process.env.GITHUB_RUN_ATTEMPT}/railway-evidence.json`,
              'utf8'
            )
          );
          const edges = railwayEvidence.data?.environment?.serviceInstances?.edges ?? [];
          const serviceByExpectedId = new Map([
            [process.env.RAILWAY_FUND_SCENARIO_CALC_SERVICE_ID, 'fund-scenario-calc'],
            [process.env.RAILWAY_CAPITAL_CALL_STATUS_SERVICE_ID, 'capital-call-status'],
          ]);
          const services = [];
          for (const serviceName of ['fund-scenario-calc', 'capital-call-status']) {
            const edge = edges.find((candidate) => {
              const node = candidate?.node;
              return node && serviceByExpectedId.get(node.serviceId) === serviceName;
            });
            const deployment = edge?.node?.latestDeployment;
            if (!deployment?.id || deployment.meta?.commitHash !== process.env.EXPECTED_SHA) {
              console.error(`Post-promotion Railway identity for ${serviceName} is not canonical.`);
              process.exit(1);
            }
            services.push({
              serviceName,
              serviceId: edge.node.serviceId,
              deploymentId: deployment.id,
              sourceSha: process.env.EXPECTED_SHA,
            });
          }
          const payload = {
            vercel: {
              projectId: process.env.VERCEL_PROJECT_ID,
              deploymentId: process.env.PROVED_DEPLOYMENT_ID,
              hostname: process.env.VERCEL_PRODUCTION_HOSTNAME,
              sourceSha: process.env.EXPECTED_SHA,
            },
            railway: {
              projectId: process.env.RAILWAY_PROJECT_ID,
              environmentId: process.env.RAILWAY_ENVIRONMENT_ID,
              services,
            },
          };
          fs.writeFileSync(`${temp}/release-provider-fragment-payload.json`, JSON.stringify(payload), { mode: 0o600 });
          NODE
          BUILD_OUTPUT="$(npx tsx scripts/release/build-release-evidence-fragment.ts \
            --kind release-provider \
            --payload-file "$RUNNER_TEMP/release-provider-fragment-payload.json" \
            --producer-job promote \
            --output "$RUNNER_TEMP/release-evidence-fragment-release-provider.json")"
          node -e '
            const parsed = JSON.parse(process.argv[1]);
            const hex = /^[a-f0-9]{64}$/;
            if (!hex.test(parsed.payloadSha256) || !hex.test(parsed.fileSha256)) {
              console.error("Release-provider fragment builder emitted an invalid result.");
              process.exit(1);
            }
            const fs = require("node:fs");
            fs.appendFileSync(process.env.GITHUB_OUTPUT, "payload_sha256=" + parsed.payloadSha256 + "\n");
            fs.appendFileSync(process.env.GITHUB_OUTPUT, "file_sha256=" + parsed.fileSha256 + "\n");
          ' "$BUILD_OUTPUT"

      - name: Upload immutable release-provider evidence fragment
        id: upload_release_provider_fragment
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.promote_fragment_meta.outputs.artifact_name }}
          path: ${{ runner.temp }}/release-evidence-fragment-release-provider.json
          retention-days: 30
          if-no-files-found: error

      - name: Remove revalidated operator evidence
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/operator-evidence-promote"

      - name: Remove promotion provider evidence
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/provider-evidence-promote-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" "$RUNNER_TEMP/release-provider-fragment-payload.json" "$RUNNER_TEMP/release-evidence-fragment-release-provider.json"

  post-promotion-smoke:
    name: Authenticated Post-promotion Smoke
    needs: [promote, validate-target]
    if: ${{ success() && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: Production
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.expected_sha }}

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run authenticated production smoke
        env:
          PRODUCTION_URL: ${{ needs.promote.outputs.production_url }}
          RUM_ALLOWED_ORIGIN: https://${{ vars.VERCEL_PRODUCTION_HOSTNAME }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          HEALTH_KEY: ${{ secrets.HEALTH_KEY }}
          METRICS_KEY: ${{ secrets.METRICS_KEY }}
          PROD_SMOKE_USERNAME: ${{ secrets.PROD_SMOKE_USERNAME }}
          PROD_SMOKE_PASSWORD: ${{ secrets.PROD_SMOKE_PASSWORD }}
        run: |
          set -euo pipefail
          : "${PRODUCTION_URL:?PRODUCTION_URL is required}"
          : "${HEALTH_KEY:?HEALTH_KEY is required}"
          : "${METRICS_KEY:?METRICS_KEY is required}"
          : "${PROD_SMOKE_USERNAME:?PROD_SMOKE_USERNAME is required}"
          : "${PROD_SMOKE_PASSWORD:?PROD_SMOKE_PASSWORD is required}"
          : "${EXPECTED_SHA:?EXPECTED_SHA is required}"
          npx playwright test tests/smoke/production-boundaries.spec.ts --project=production --reporter=line

      - name: Require clean Vercel database-driver log window
        env:
          LOG_WINDOW_START: ${{ needs.validate-target.outputs.log_window_start }}
          PRODUCTION_URL: ${{ needs.promote.outputs.production_url }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          : "${LOG_WINDOW_START:?LOG_WINDOW_START is required}"
          : "${PRODUCTION_URL:?PRODUCTION_URL is required}"
          : "${VERCEL_TOKEN:?VERCEL_TOKEN is required}"
          runtime_log="$RUNNER_TEMP/vercel-runtime.jsonl"
          trap 'rm -f "$runtime_log"' EXIT
          signature_queries=(
            '"Neon pool error"'
            '"fetch failed"'
            '"No transactions support in neon-http driver"'
          )
          for signature_query in "${signature_queries[@]}"; do
            npx --yes vercel@55.0.0 logs "$PRODUCTION_URL" \
              --environment production \
              --since "$LOG_WINDOW_START" \
              --query "$signature_query" \
              --limit 1 \
              --no-follow \
              --json \
              --no-color > "$runtime_log"
            node scripts/assert-vercel-driver-log-clean.mjs "$runtime_log"
          done

  evidence-finalizer:
    name: Release Evidence Manifest Finalizer
    needs:
      - validate-target
      - baseline-policy-preflight
      - release-proof
      - schema-audit
      - stage-production
      - validate-deployment
      - railway-workers-verify
      - staged-smoke
      - staged-provider-identity
      - g4-operator-evidence
      - promote
      - post-promotion-smoke
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - name: Require attempt 1 before evidence finalization
        run: |
          set -euo pipefail
          if [[ "$GITHUB_RUN_ATTEMPT" != "1" ]]; then
            echo "::error::Evidence finalization is only permitted on workflow attempt 1; never stitch prior-attempt artifacts."
            exit 1
          fi

      - name: Checkout exact release commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.expected_sha }}

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env

      - name: Compute earliest failure stage from the fixed DAG
        id: failure_stage
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VALIDATE_TARGET_RESULT: ${{ needs.validate-target.result }}
          BASELINE_POLICY_PREFLIGHT_RESULT: ${{ needs.baseline-policy-preflight.result }}
          RELEASE_PROOF_RESULT: ${{ needs.release-proof.result }}
          SCHEMA_AUDIT_RESULT: ${{ needs.schema-audit.result }}
          STAGE_PRODUCTION_RESULT: ${{ needs.stage-production.result }}
          VALIDATE_DEPLOYMENT_RESULT: ${{ needs.validate-deployment.result }}
          RAILWAY_WORKERS_VERIFY_RESULT: ${{ needs.railway-workers-verify.result }}
          STAGED_SMOKE_RESULT: ${{ needs.staged-smoke.result }}
          STAGED_PROVIDER_IDENTITY_RESULT: ${{ needs.staged-provider-identity.result }}
          G4_OPERATOR_EVIDENCE_RESULT: ${{ needs.g4-operator-evidence.result }}
          PROMOTE_RESULT: ${{ needs.promote.result }}
          POST_PROMOTION_SMOKE_RESULT: ${{ needs.post-promotion-smoke.result }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          // Fixed DAG order; a failed or skipped producer is never converted
          // into success. The earliest non-success stage wins.
          const stages = [
            ['validate-target', process.env.VALIDATE_TARGET_RESULT],
            ['baseline-policy-preflight', process.env.BASELINE_POLICY_PREFLIGHT_RESULT],
            ['release-proof', process.env.RELEASE_PROOF_RESULT],
            ['schema-audit', process.env.SCHEMA_AUDIT_RESULT],
            ['stage-production', process.env.STAGE_PRODUCTION_RESULT],
            ['validate-deployment', process.env.VALIDATE_DEPLOYMENT_RESULT],
            ['railway-workers-verify', process.env.RAILWAY_WORKERS_VERIFY_RESULT],
            ['staged-smoke', process.env.STAGED_SMOKE_RESULT],
            ['staged-provider-identity', process.env.STAGED_PROVIDER_IDENTITY_RESULT],
            ['g4-operator-evidence', process.env.G4_OPERATOR_EVIDENCE_RESULT],
            ['promote', process.env.PROMOTE_RESULT],
            ['post-promotion-smoke', process.env.POST_PROMOTION_SMOKE_RESULT],
          ];
          const allowed = new Set(['success', 'failure', 'cancelled', 'skipped']);
          for (const [stage, result] of stages) {
            if (!allowed.has(result)) {
              console.error(`Stage ${stage} reported an unrecognized result: ${String(result)}`);
              process.exit(1);
            }
          }
          const firstFailure = stages.find(([, result]) => result !== 'success');
          const outcome = firstFailure ? 'failure' : 'success';
          const failureStage = firstFailure ? firstFailure[0] : '';
          const results = Object.fromEntries(stages);
          fs.writeFileSync(process.env.RUNNER_TEMP + "/finalizer-stage-results.json", JSON.stringify(results), { mode: 0o600 });
          fs.appendFileSync(process.env.GITHUB_OUTPUT, "pre_manifest_outcome=" + outcome + "\n");
          fs.appendFileSync(process.env.GITHUB_OUTPUT, "failure_stage=" + failureStage + "\n");
          NODE
          RUN_STARTED_AT="$(gh api "repos/${REPO}/actions/runs/${GITHUB_RUN_ID}" --jq '.run_started_at')"
          if [[ ! "$RUN_STARTED_AT" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]; then
            echo "::error::Current run start time is unresolvable."
            exit 1
          fi
          echo "run_started_at=$RUN_STARTED_AT" >> "$GITHUB_OUTPUT"

      - name: Download certification and lineage by exact artifact IDs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          CERTIFICATION_ARTIFACT_ID: ${{ needs.release-proof.outputs.certification_artifact_id }}
          CERTIFICATION_ARTIFACT_NAME: ${{ needs.release-proof.outputs.certification_artifact_name }}
          CERTIFICATION_ARTIFACT_DIGEST: ${{ needs.release-proof.outputs.certification_artifact_digest }}
          CERTIFICATION_FILE_SHA256: ${{ needs.release-proof.outputs.certification_file_sha256 }}
          LINEAGE_ARTIFACT_ID: ${{ needs.release-proof.outputs.lineage_artifact_id }}
          LINEAGE_ARTIFACT_NAME: ${{ needs.release-proof.outputs.lineage_artifact_name }}
          LINEAGE_ARTIFACT_DIGEST: ${{ needs.release-proof.outputs.lineage_artifact_digest }}
          LINEAGE_FILE_SHA256: ${{ needs.release-proof.outputs.lineage_file_sha256 }}
        run: |
          set -euo pipefail
          : "${CERTIFICATION_ARTIFACT_ID:?CERTIFICATION_ARTIFACT_ID is required}"
          : "${LINEAGE_ARTIFACT_ID:?LINEAGE_ARTIFACT_ID is required}"
          EVIDENCE_DIR="$RUNNER_TEMP/finalizer-evidence"
          rm -rf -- "$EVIDENCE_DIR"
          mkdir -m 0700 -- "$EVIDENCE_DIR"
          fetch_by_exact_id() {
            local label="$1" artifact_id="$2" artifact_name="$3" artifact_digest="$4" file_sha256="$5"
            gh api "repos/${REPO}/actions/artifacts/${artifact_id}" > "$EVIDENCE_DIR/${label}-record.json"
            ARTIFACT_LABEL="$label" ARTIFACT_ID="$artifact_id" ARTIFACT_NAME="$artifact_name" ARTIFACT_DIGEST="$artifact_digest" \
              node -e '
                const fs = require("node:fs");
                const record = JSON.parse(
                  fs.readFileSync(process.env.RUNNER_TEMP + "/finalizer-evidence/" + process.env.ARTIFACT_LABEL + "-record.json", "utf8")
                );
                const expectedSuffix = "-" + process.env.GITHUB_RUN_ID + "-" + process.env.GITHUB_RUN_ATTEMPT + "-" + process.env.EXPECTED_SHA;
                const valid =
                  String(record.id) === process.env.ARTIFACT_ID &&
                  String(record.workflow_run?.id) === process.env.GITHUB_RUN_ID &&
                  record.expired === false &&
                  record.name === process.env.ARTIFACT_NAME &&
                  record.name.endsWith(expectedSuffix) &&
                  record.digest === process.env.ARTIFACT_DIGEST;
                if (!valid) {
                  console.error(process.env.ARTIFACT_LABEL + " artifact record does not match this exact execution.");
                  process.exit(1);
                }
              '
            gh api "repos/${REPO}/actions/artifacts/${artifact_id}/zip" > "$EVIDENCE_DIR/${label}.zip"
            mkdir -m 0700 -- "$EVIDENCE_DIR/${label}"
            unzip -o "$EVIDENCE_DIR/${label}.zip" -d "$EVIDENCE_DIR/${label}"
            if find "$EVIDENCE_DIR/${label}" -type l | grep -q .; then
              echo "::error::${label} artifact contains symlinks."
              exit 1
            fi
            if [ "$(find "$EVIDENCE_DIR/${label}" -type f | wc -l)" -ne 1 ]; then
              echo "::error::${label} artifact must contain exactly one file."
              exit 1
            fi
            local extracted
            extracted="$(find "$EVIDENCE_DIR/${label}" -type f)"
            local recomputed
            recomputed="$(sha256sum "$extracted" | cut -d' ' -f1)"
            if [ "$recomputed" != "$file_sha256" ]; then
              echo "::error::${label} recomputed file hash does not equal the producer output."
              exit 1
            fi
            mv -- "$extracted" "$EVIDENCE_DIR/${label}.json"
          }
          fetch_by_exact_id certification "$CERTIFICATION_ARTIFACT_ID" "$CERTIFICATION_ARTIFACT_NAME" "$CERTIFICATION_ARTIFACT_DIGEST" "$CERTIFICATION_FILE_SHA256"
          fetch_by_exact_id lineage "$LINEAGE_ARTIFACT_ID" "$LINEAGE_ARTIFACT_NAME" "$LINEAGE_ARTIFACT_DIGEST" "$LINEAGE_FILE_SHA256"

      - name: Download produced evidence fragments by exact artifact IDs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          BASELINE_ARTIFACT_ID: ${{ needs.baseline-policy-preflight.outputs.baseline_artifact_id }}
          BASELINE_ARTIFACT_NAME: ${{ needs.baseline-policy-preflight.outputs.baseline_artifact_name }}
          BASELINE_ARTIFACT_DIGEST: ${{ needs.baseline-policy-preflight.outputs.baseline_artifact_digest }}
          BASELINE_FILE_SHA256: ${{ needs.baseline-policy-preflight.outputs.baseline_file_sha256 }}
          POLICY_CONFIG_ARTIFACT_ID: ${{ needs.baseline-policy-preflight.outputs.policy_config_artifact_id }}
          POLICY_CONFIG_ARTIFACT_NAME: ${{ needs.baseline-policy-preflight.outputs.policy_config_artifact_name }}
          POLICY_CONFIG_ARTIFACT_DIGEST: ${{ needs.baseline-policy-preflight.outputs.policy_config_artifact_digest }}
          POLICY_CONFIG_FILE_SHA256: ${{ needs.baseline-policy-preflight.outputs.policy_config_file_sha256 }}
          SCHEMA_ARTIFACT_ID: ${{ needs.schema-audit.outputs.schema_artifact_id }}
          SCHEMA_ARTIFACT_NAME: ${{ needs.schema-audit.outputs.schema_artifact_name }}
          SCHEMA_ARTIFACT_DIGEST: ${{ needs.schema-audit.outputs.schema_artifact_digest }}
          SCHEMA_FILE_SHA256: ${{ needs.schema-audit.outputs.schema_file_sha256 }}
          SCHEMA_RESULT: ${{ needs.schema-audit.result }}
          POLICY_MEASUREMENT_ARTIFACT_ID: ${{ needs.staged-smoke.outputs.policy_measurement_artifact_id }}
          POLICY_MEASUREMENT_ARTIFACT_NAME: ${{ needs.staged-smoke.outputs.policy_measurement_artifact_name }}
          POLICY_MEASUREMENT_ARTIFACT_DIGEST: ${{ needs.staged-smoke.outputs.policy_measurement_artifact_digest }}
          POLICY_MEASUREMENT_FILE_SHA256: ${{ needs.staged-smoke.outputs.policy_measurement_file_sha256 }}
          STAGED_SMOKE_RESULT: ${{ needs.staged-smoke.result }}
          CANARY_RESULT_ARTIFACT_ID: ${{ needs.staged-smoke.outputs.canary_result_artifact_id }}
          CANARY_RESULT_ARTIFACT_NAME: ${{ needs.staged-smoke.outputs.canary_result_artifact_name }}
          CANARY_RESULT_ARTIFACT_DIGEST: ${{ needs.staged-smoke.outputs.canary_result_artifact_digest }}
          CANARY_RESULT_FILE_SHA256: ${{ needs.staged-smoke.outputs.canary_result_file_sha256 }}

          OPERATOR_EVIDENCE_ARTIFACT_ID: ${{ needs.g4-operator-evidence.outputs.operator_evidence_artifact_id }}
          OPERATOR_EVIDENCE_ARTIFACT_NAME: ${{ needs.g4-operator-evidence.outputs.operator_evidence_artifact_name }}
          OPERATOR_EVIDENCE_ARTIFACT_DIGEST: ${{ needs.g4-operator-evidence.outputs.operator_evidence_artifact_digest }}
          OPERATOR_EVIDENCE_FILE_SHA256: ${{ needs.g4-operator-evidence.outputs.operator_evidence_file_sha256 }}
          G4_OPERATOR_EVIDENCE_RESULT: ${{ needs.g4-operator-evidence.result }}
          RELEASE_PROVIDER_ARTIFACT_ID: ${{ needs.promote.outputs.release_provider_artifact_id }}
          RELEASE_PROVIDER_ARTIFACT_NAME: ${{ needs.promote.outputs.release_provider_artifact_name }}
          RELEASE_PROVIDER_ARTIFACT_DIGEST: ${{ needs.promote.outputs.release_provider_artifact_digest }}
          RELEASE_PROVIDER_FILE_SHA256: ${{ needs.promote.outputs.release_provider_file_sha256 }}
          PROMOTE_RESULT: ${{ needs.promote.result }}
          BASELINE_POLICY_PREFLIGHT_RESULT: ${{ needs.baseline-policy-preflight.result }}
        run: |
          set -euo pipefail
          EVIDENCE_DIR="$RUNNER_TEMP/finalizer-evidence"
          fetch_fragment() {
            local kind="$1" producer_result="$2" artifact_id="$3" artifact_name="$4" artifact_digest="$5" file_sha256="$6"
            if [ "$producer_result" != "success" ]; then
              echo "Fragment ${kind}: producer concluded ${producer_result}; recording null."
              return 0
            fi
            if [ -z "$artifact_id" ]; then
              echo "::error::Fragment ${kind}: successful producer exposed no artifact ID."
              exit 1
            fi
            gh api "repos/${REPO}/actions/artifacts/${artifact_id}" > "$EVIDENCE_DIR/fragment-${kind}-record.json"
            FRAGMENT_KIND="$kind" ARTIFACT_ID="$artifact_id" ARTIFACT_NAME="$artifact_name" ARTIFACT_DIGEST="$artifact_digest" \
              node -e '
                const fs = require("node:fs");
                const record = JSON.parse(
                  fs.readFileSync(process.env.RUNNER_TEMP + "/finalizer-evidence/fragment-" + process.env.FRAGMENT_KIND + "-record.json", "utf8")
                );
                const expectedName = "release-evidence-fragment-v1-" + process.env.FRAGMENT_KIND + "-" + process.env.GITHUB_RUN_ID + "-" + process.env.GITHUB_RUN_ATTEMPT + "-" + process.env.EXPECTED_SHA;
                const valid =
                  String(record.id) === process.env.ARTIFACT_ID &&
                  String(record.workflow_run?.id) === process.env.GITHUB_RUN_ID &&
                  record.expired === false &&
                  record.name === expectedName &&
                  record.name === process.env.ARTIFACT_NAME &&
                  record.digest === process.env.ARTIFACT_DIGEST;
                if (!valid) {
                  console.error("Fragment " + process.env.FRAGMENT_KIND + " artifact record does not match this exact execution.");
                  process.exit(1);
                }
              '
            gh api "repos/${REPO}/actions/artifacts/${artifact_id}/zip" > "$EVIDENCE_DIR/fragment-${kind}.zip"
            mkdir -m 0700 -- "$EVIDENCE_DIR/fragment-${kind}"
            unzip -o "$EVIDENCE_DIR/fragment-${kind}.zip" -d "$EVIDENCE_DIR/fragment-${kind}"
            if find "$EVIDENCE_DIR/fragment-${kind}" -type l | grep -q .; then
              echo "::error::Fragment ${kind} artifact contains symlinks."
              exit 1
            fi
            if [ "$(find "$EVIDENCE_DIR/fragment-${kind}" -type f | wc -l)" -ne 1 ]; then
              echo "::error::Fragment ${kind} artifact must contain exactly one file."
              exit 1
            fi
            local extracted
            extracted="$(find "$EVIDENCE_DIR/fragment-${kind}" -type f)"
            local recomputed
            recomputed="$(sha256sum "$extracted" | cut -d' ' -f1)"
            if [ "$recomputed" != "$file_sha256" ]; then
              echo "::error::Fragment ${kind} recomputed file hash does not equal the producer output."
              exit 1
            fi
            mv -- "$extracted" "$EVIDENCE_DIR/fragment-${kind}.json"
          }
          fetch_fragment baseline "$BASELINE_POLICY_PREFLIGHT_RESULT" "$BASELINE_ARTIFACT_ID" "$BASELINE_ARTIFACT_NAME" "$BASELINE_ARTIFACT_DIGEST" "$BASELINE_FILE_SHA256"
          fetch_fragment policy-config "$BASELINE_POLICY_PREFLIGHT_RESULT" "$POLICY_CONFIG_ARTIFACT_ID" "$POLICY_CONFIG_ARTIFACT_NAME" "$POLICY_CONFIG_ARTIFACT_DIGEST" "$POLICY_CONFIG_FILE_SHA256"
          fetch_fragment schema "$SCHEMA_RESULT" "$SCHEMA_ARTIFACT_ID" "$SCHEMA_ARTIFACT_NAME" "$SCHEMA_ARTIFACT_DIGEST" "$SCHEMA_FILE_SHA256"
          fetch_fragment policy-measurement "$STAGED_SMOKE_RESULT" "$POLICY_MEASUREMENT_ARTIFACT_ID" "$POLICY_MEASUREMENT_ARTIFACT_NAME" "$POLICY_MEASUREMENT_ARTIFACT_DIGEST" "$POLICY_MEASUREMENT_FILE_SHA256"
          fetch_fragment canary-result "$STAGED_SMOKE_RESULT" "$CANARY_RESULT_ARTIFACT_ID" "$CANARY_RESULT_ARTIFACT_NAME" "$CANARY_RESULT_ARTIFACT_DIGEST" "$CANARY_RESULT_FILE_SHA256"
          fetch_fragment operator-evidence "$G4_OPERATOR_EVIDENCE_RESULT" "$OPERATOR_EVIDENCE_ARTIFACT_ID" "$OPERATOR_EVIDENCE_ARTIFACT_NAME" "$OPERATOR_EVIDENCE_ARTIFACT_DIGEST" "$OPERATOR_EVIDENCE_FILE_SHA256"
          fetch_fragment release-provider "$PROMOTE_RESULT" "$RELEASE_PROVIDER_ARTIFACT_ID" "$RELEASE_PROVIDER_ARTIFACT_NAME" "$RELEASE_PROVIDER_ARTIFACT_DIGEST" "$RELEASE_PROVIDER_FILE_SHA256"

      - name: Independently verify primary PR provenance
        id: resolve_pr_head
        if: inputs.release_mode == 'primary'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          : "${PR_NUMBER:?PR_NUMBER is required for primary mode}"
          pr_json="$(gh api "repos/${REPO}/pulls/${PR_NUMBER}")"
          PR_HEAD="$(PR_JSON="$pr_json" EXPECTED_SHA="$EXPECTED_SHA" node -e '
            const pr = JSON.parse(process.env.PR_JSON ?? "");
            const head = String(pr?.head?.sha ?? "");
            if (!/^[0-9a-f]{40}$/.test(head) || pr?.merged !== true || pr?.base?.ref !== "main" || pr?.merge_commit_sha !== process.env.EXPECTED_SHA) process.exit(1);
            process.stdout.write(head);
          ')"
          echo "pr_head_sha=${PR_HEAD}" >> "$GITHUB_OUTPUT"

      - name: Build and validate release evidence manifest
        id: build_manifest
        env:
          RELEASE_EVIDENCE_INPUTS_PATH: ${{ runner.temp }}/finalizer-evidence/manifest-inputs.json
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          RELEASE_MODE: ${{ inputs.release_mode }}
          PR_NUMBER: ${{ inputs.pr_number }}
          PR_HEAD_SHA: ${{ steps.resolve_pr_head.outputs.pr_head_sha }}
          BASELINE_EVIDENCE_B64: ${{ inputs.baseline_evidence_b64 }}
          SCHEMA_APPLY_RUN_ID: ${{ inputs.schema_apply_run_id }}
          SCHEMA_APPLY_RUN_ATTEMPT: ${{ inputs.schema_apply_run_attempt }}
          SCHEMA_APPLY_ARTIFACT_ID: ${{ inputs.schema_apply_artifact_id }}
          SCHEMA_APPLY_ARTIFACT_DIGEST: ${{ inputs.schema_apply_artifact_digest }}
          SCHEMA_APPLY_RECEIPT_FILE_SHA256: ${{ inputs.schema_apply_receipt_file_sha256 }}
          SCHEMA_PRECURSOR_SHA: ${{ inputs.schema_precursor_sha }}
          PRE_MANIFEST_OUTCOME: ${{ steps.failure_stage.outputs.pre_manifest_outcome }}
          FAILURE_STAGE: ${{ steps.failure_stage.outputs.failure_stage }}
          RUN_STARTED_AT: ${{ steps.failure_stage.outputs.run_started_at }}
          PROOF_RUN_ID: ${{ needs.release-proof.outputs.proof_run_id }}
          PROOF_RUN_ATTEMPT: ${{ needs.release-proof.outputs.proof_run_attempt }}
          PROOF_SOURCE_SHA: ${{ needs.release-proof.outputs.proof_source_sha }}
          CALLER_WORKFLOW_REF: ${{ needs.release-proof.outputs.caller_workflow_ref }}
          PROOF_WORKFLOW_REF: ${{ needs.release-proof.outputs.proof_workflow_ref }}
          PROOF_CONCLUSION: ${{ needs.release-proof.outputs.proof_conclusion }}
          CERTIFICATION_ARTIFACT_ID: ${{ needs.release-proof.outputs.certification_artifact_id }}
          CERTIFICATION_ARTIFACT_NAME: ${{ needs.release-proof.outputs.certification_artifact_name }}
          CERTIFICATION_ARTIFACT_DIGEST: ${{ needs.release-proof.outputs.certification_artifact_digest }}
          CERTIFICATION_FILE_SHA256: ${{ needs.release-proof.outputs.certification_file_sha256 }}
          LINEAGE_ARTIFACT_ID: ${{ needs.release-proof.outputs.lineage_artifact_id }}
          LINEAGE_ARTIFACT_NAME: ${{ needs.release-proof.outputs.lineage_artifact_name }}
          LINEAGE_ARTIFACT_DIGEST: ${{ needs.release-proof.outputs.lineage_artifact_digest }}
          LINEAGE_FILE_SHA256: ${{ needs.release-proof.outputs.lineage_file_sha256 }}
          CHARACTERIZATION_ARTIFACT_ID: ${{ needs.release-proof.outputs.characterization_artifact_id }}
          CHARACTERIZATION_ARTIFACT_NAME: ${{ needs.release-proof.outputs.characterization_artifact_name }}
          CHARACTERIZATION_ARTIFACT_DIGEST: ${{ needs.release-proof.outputs.characterization_artifact_digest }}
          CHARACTERIZATION_FILE_SHA256: ${{ needs.release-proof.outputs.characterization_file_sha256 }}
          CHARACTERIZATION_SOURCE_SHA: ${{ needs.release-proof.outputs.characterization_source_sha }}
          BASELINE_ARTIFACT_ID: ${{ needs.baseline-policy-preflight.outputs.baseline_artifact_id }}
          BASELINE_ARTIFACT_NAME: ${{ needs.baseline-policy-preflight.outputs.baseline_artifact_name }}
          BASELINE_ARTIFACT_DIGEST: ${{ needs.baseline-policy-preflight.outputs.baseline_artifact_digest }}
          BASELINE_FILE_SHA256: ${{ needs.baseline-policy-preflight.outputs.baseline_file_sha256 }}
          BASELINE_PAYLOAD_SHA256: ${{ needs.baseline-policy-preflight.outputs.baseline_payload_sha256 }}
          POLICY_CONFIG_ARTIFACT_ID: ${{ needs.baseline-policy-preflight.outputs.policy_config_artifact_id }}
          POLICY_CONFIG_ARTIFACT_NAME: ${{ needs.baseline-policy-preflight.outputs.policy_config_artifact_name }}
          POLICY_CONFIG_ARTIFACT_DIGEST: ${{ needs.baseline-policy-preflight.outputs.policy_config_artifact_digest }}
          POLICY_CONFIG_FILE_SHA256: ${{ needs.baseline-policy-preflight.outputs.policy_config_file_sha256 }}
          POLICY_CONFIG_PAYLOAD_SHA256: ${{ needs.baseline-policy-preflight.outputs.policy_config_payload_sha256 }}
          SCHEMA_ARTIFACT_ID: ${{ needs.schema-audit.outputs.schema_artifact_id }}
          SCHEMA_ARTIFACT_NAME: ${{ needs.schema-audit.outputs.schema_artifact_name }}
          SCHEMA_ARTIFACT_DIGEST: ${{ needs.schema-audit.outputs.schema_artifact_digest }}
          SCHEMA_FILE_SHA256: ${{ needs.schema-audit.outputs.schema_file_sha256 }}
          SCHEMA_PAYLOAD_SHA256: ${{ needs.schema-audit.outputs.schema_payload_sha256 }}
          POLICY_MEASUREMENT_ARTIFACT_ID: ${{ needs.staged-smoke.outputs.policy_measurement_artifact_id }}
          POLICY_MEASUREMENT_ARTIFACT_NAME: ${{ needs.staged-smoke.outputs.policy_measurement_artifact_name }}
          POLICY_MEASUREMENT_ARTIFACT_DIGEST: ${{ needs.staged-smoke.outputs.policy_measurement_artifact_digest }}
          POLICY_MEASUREMENT_FILE_SHA256: ${{ needs.staged-smoke.outputs.policy_measurement_file_sha256 }}
          POLICY_MEASUREMENT_PAYLOAD_SHA256: ${{ needs.staged-smoke.outputs.policy_measurement_payload_sha256 }}
          CANARY_RESULT_ARTIFACT_ID: ${{ needs.staged-smoke.outputs.canary_result_artifact_id }}
          CANARY_RESULT_ARTIFACT_NAME: ${{ needs.staged-smoke.outputs.canary_result_artifact_name }}
          CANARY_RESULT_ARTIFACT_DIGEST: ${{ needs.staged-smoke.outputs.canary_result_artifact_digest }}
          CANARY_RESULT_FILE_SHA256: ${{ needs.staged-smoke.outputs.canary_result_file_sha256 }}
          CANARY_RESULT_PAYLOAD_SHA256: ${{ needs.staged-smoke.outputs.canary_result_payload_sha256 }}
          OPERATOR_EVIDENCE_ARTIFACT_ID: ${{ needs.g4-operator-evidence.outputs.operator_evidence_artifact_id }}
          OPERATOR_EVIDENCE_ARTIFACT_NAME: ${{ needs.g4-operator-evidence.outputs.operator_evidence_artifact_name }}
          OPERATOR_EVIDENCE_ARTIFACT_DIGEST: ${{ needs.g4-operator-evidence.outputs.operator_evidence_artifact_digest }}
          OPERATOR_EVIDENCE_FILE_SHA256: ${{ needs.g4-operator-evidence.outputs.operator_evidence_file_sha256 }}
          OPERATOR_EVIDENCE_PAYLOAD_SHA256: ${{ needs.g4-operator-evidence.outputs.operator_evidence_payload_sha256 }}
          RELEASE_PROVIDER_ARTIFACT_ID: ${{ needs.promote.outputs.release_provider_artifact_id }}
          RELEASE_PROVIDER_ARTIFACT_NAME: ${{ needs.promote.outputs.release_provider_artifact_name }}
          RELEASE_PROVIDER_ARTIFACT_DIGEST: ${{ needs.promote.outputs.release_provider_artifact_digest }}
          RELEASE_PROVIDER_FILE_SHA256: ${{ needs.promote.outputs.release_provider_file_sha256 }}
          RELEASE_PROVIDER_PAYLOAD_SHA256: ${{ needs.promote.outputs.release_provider_payload_sha256 }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const temp = process.env.RUNNER_TEMP;
          const evidenceDir = `${temp}/finalizer-evidence`;
          const optionalFile = (name) =>
            fs.existsSync(`${evidenceDir}/${name}.json`) ? `${evidenceDir}/${name}.json` : null;
          const fragmentLineage = (kind, envPrefix, producerJob) => {
            const path = optionalFile(`fragment-${kind}`);
            if (path === null) return null;
            return {
              kind,
              path,
              artifactId: process.env[`${envPrefix}_ARTIFACT_ID`],
              artifactName: process.env[`${envPrefix}_ARTIFACT_NAME`],
              artifactArchiveSha256: process.env[`${envPrefix}_ARTIFACT_DIGEST`],
              fileSha256: process.env[`${envPrefix}_FILE_SHA256`],
              payloadSha256: process.env[`${envPrefix}_PAYLOAD_SHA256`],
              producerJob,
            };
          };
          const inputs = {
            source: {
              repository: process.env.GITHUB_REPOSITORY,
              sha: process.env.EXPECTED_SHA,
              releaseMode: process.env.RELEASE_MODE,
              pullRequest: Number(process.env.PR_NUMBER),
              pullRequestHeadSha: process.env.PR_HEAD_SHA,
            },
            baselineEvidenceB64: process.env.BASELINE_EVIDENCE_B64,
            certificationFilePath: `${evidenceDir}/certification.json`,
            lineageFilePath: `${evidenceDir}/lineage.json`,
            certificationOutputs: {
              proofRunId: process.env.PROOF_RUN_ID,
              proofRunAttempt: process.env.PROOF_RUN_ATTEMPT,
              proofSourceSha: process.env.PROOF_SOURCE_SHA,
              callerWorkflowRef: process.env.CALLER_WORKFLOW_REF,
              proofWorkflowRef: process.env.PROOF_WORKFLOW_REF,
              proofConclusion: process.env.PROOF_CONCLUSION,
              certificationArtifactId: process.env.CERTIFICATION_ARTIFACT_ID,
              certificationArtifactName: process.env.CERTIFICATION_ARTIFACT_NAME,
              certificationArtifactDigest: process.env.CERTIFICATION_ARTIFACT_DIGEST,
              certificationFileSha256: process.env.CERTIFICATION_FILE_SHA256,
              lineageArtifactId: process.env.LINEAGE_ARTIFACT_ID,
              lineageArtifactName: process.env.LINEAGE_ARTIFACT_NAME,
              lineageArtifactDigest: process.env.LINEAGE_ARTIFACT_DIGEST,
              lineageFileSha256: process.env.LINEAGE_FILE_SHA256,
            },
            characterization:
              process.env.CHARACTERIZATION_ARTIFACT_ID
                ? {
                    artifactId: process.env.CHARACTERIZATION_ARTIFACT_ID,
                    artifactName: process.env.CHARACTERIZATION_ARTIFACT_NAME,
                    artifactArchiveSha256: process.env.CHARACTERIZATION_ARTIFACT_DIGEST,
                    fileSha256: process.env.CHARACTERIZATION_FILE_SHA256,
                    sourceSha: process.env.CHARACTERIZATION_SOURCE_SHA,
                  }
                : null,
            schemaInputs:
              process.env.SCHEMA_APPLY_RUN_ID
                ? {
                    runId: process.env.SCHEMA_APPLY_RUN_ID,
                    runAttempt: process.env.SCHEMA_APPLY_RUN_ATTEMPT,
                    artifactId: process.env.SCHEMA_APPLY_ARTIFACT_ID,
                    artifactDigest: process.env.SCHEMA_APPLY_ARTIFACT_DIGEST,
                    receiptFileSha256: process.env.SCHEMA_APPLY_RECEIPT_FILE_SHA256,
                    precursorSha: process.env.SCHEMA_PRECURSOR_SHA,
                  }
                : null,
            workflow: {
              runId: process.env.GITHUB_RUN_ID,
              runAttempt: Number(process.env.GITHUB_RUN_ATTEMPT),
              startedAt: process.env.RUN_STARTED_AT,
              preManifestOutcome: process.env.PRE_MANIFEST_OUTCOME,
              failureStage: process.env.FAILURE_STAGE === '' ? null : process.env.FAILURE_STAGE,
            },
            fragments: {
              baseline: fragmentLineage('baseline', 'BASELINE', 'baseline-policy-preflight'),
              schema: fragmentLineage('schema', 'SCHEMA', 'schema-audit'),
              policyConfig: fragmentLineage('policy-config', 'POLICY_CONFIG', 'baseline-policy-preflight'),
              policyMeasurement: fragmentLineage('policy-measurement', 'POLICY_MEASUREMENT', 'staged-smoke'),
              operatorEvidence: fragmentLineage('operator-evidence', 'OPERATOR_EVIDENCE', 'g4-operator-evidence'),
              releaseProvider: fragmentLineage('release-provider', 'RELEASE_PROVIDER', 'promote'),
              canaryResult: fragmentLineage('canary-result', 'CANARY_RESULT', 'staged-smoke'),
            },
          };
          fs.writeFileSync(process.env.RELEASE_EVIDENCE_INPUTS_PATH, JSON.stringify(inputs), { mode: 0o600 });
          NODE
          npx tsx scripts/release/build-release-evidence-manifest.ts \
            --designation infrastructure_only \
            --candidate false \
            --output "$RUNNER_TEMP/release-evidence-manifest-v1.json"

      - name: Name attempt-qualified manifest artifact
        id: manifest_meta
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          echo "artifact_name=release-evidence-manifest-v1-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${EXPECTED_SHA}" >> "$GITHUB_OUTPUT"

      - name: Upload sanitized release evidence manifest
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.manifest_meta.outputs.artifact_name }}
          path: ${{ runner.temp }}/release-evidence-manifest-v1.json
          retention-days: 30
          if-no-files-found: error

      - name: Remove local manifest evidence
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/release-evidence-manifest-v1.json" "$RUNNER_TEMP/finalizer-evidence" "$RUNNER_TEMP/finalizer-stage-results.json"
