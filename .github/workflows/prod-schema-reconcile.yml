name: Production Schema Reconcile

on:
  workflow_call:
    inputs:
      mode:
        description: Audit production or apply additive-safe reconciliation
        type: string
        required: false
        default: audit
      expected_sha:
        description: Full commit SHA expected to be checked out
        type: string
        required: true
      # Historical schema-apply identity (audit mode only). When all six are
      # provided, the audit additionally proves the exact recorded 0053 apply
      # run/artifact/receipt and emits a schema evidence fragment. Caller-
      # supplied URLs or prose references are never accepted as schema proof.
      schema_apply_run_id:
        description: Exact historical schema apply workflow run ID
        type: string
        required: false
        default: ''
      schema_apply_run_attempt:
        description: Exact historical schema apply run attempt (must be 1)
        type: string
        required: false
        default: ''
      schema_apply_artifact_id:
        description: Exact historical schema apply evidence artifact ID
        type: string
        required: false
        default: ''
      schema_apply_artifact_digest:
        description: API archive digest of the historical apply artifact
        type: string
        required: false
        default: ''
      schema_apply_receipt_file_sha256:
        description: SHA-256 of the historical schema apply receipt file
        type: string
        required: false
        default: ''
      schema_precursor_sha:
        description: Schema-only precursor commit SHA of the historical apply
        type: string
        required: false
        default: ''
    outputs:
      schema_artifact_id:
        description: Exact artifact ID of the schema evidence fragment
        value: ${{ jobs.reconcile.outputs.schema_artifact_id }}
      schema_artifact_name:
        description: Exact attempt-qualified schema fragment artifact name
        value: ${{ jobs.reconcile.outputs.schema_artifact_name }}
      schema_artifact_digest:
        description: Upload-reported archive digest of the schema fragment
        value: ${{ jobs.reconcile.outputs.schema_artifact_digest }}
      schema_file_sha256:
        description: Recomputed SHA-256 of the schema fragment file
        value: ${{ jobs.reconcile.outputs.schema_file_sha256 }}
      schema_payload_sha256:
        description: Canonical payload SHA-256 of the schema fragment
        value: ${{ jobs.reconcile.outputs.schema_payload_sha256 }}
  workflow_dispatch:
    inputs:
      mode:
        description: Audit production or apply additive-safe reconciliation
        type: choice
        options:
          - audit
          - apply
          - apply-catchup-0050-0053
        default: audit
      expected_sha:
        description: Full commit SHA expected to be checked out
        type: string
        required: true

# actions: read exists solely for the exact-ID historical apply artifact
# fetch; no write or broader permission is ever granted here.
permissions:
  contents: read
  actions: read

concurrency:
  group: prod-schema-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    name: Reconcile Production Schema
    runs-on: ubuntu-latest
    # 30 minutes: catch-up mode applies up to four migrations plus two full
    # manifest audits in one job; statement_timeout bounds each DDL at 5min.
    timeout-minutes: 30
    environment: production-schema
    outputs:
      schema_artifact_id: ${{ steps.upload_schema_fragment.outputs.artifact-id }}
      schema_artifact_name: ${{ steps.schema_fragment_meta.outputs.artifact_name }}
      schema_artifact_digest: ${{ steps.upload_schema_fragment.outputs.artifact-digest }}
      schema_file_sha256: ${{ steps.build_schema_fragment.outputs.file_sha256 }}
      schema_payload_sha256: ${{ steps.build_schema_fragment.outputs.payload_sha256 }}

    steps:
      - name: Validate mode input
        env:
          MODE: ${{ inputs.mode }}
          SCHEMA_APPLY_RUN_ID: ${{ inputs.schema_apply_run_id }}
          SCHEMA_APPLY_RUN_ATTEMPT: ${{ inputs.schema_apply_run_attempt }}
          SCHEMA_APPLY_ARTIFACT_ID: ${{ inputs.schema_apply_artifact_id }}
          SCHEMA_APPLY_ARTIFACT_DIGEST: ${{ inputs.schema_apply_artifact_digest }}
          SCHEMA_APPLY_RECEIPT_FILE_SHA256: ${{ inputs.schema_apply_receipt_file_sha256 }}
          SCHEMA_PRECURSOR_SHA: ${{ inputs.schema_precursor_sha }}
        run: |
          set -euo pipefail
          case "$MODE" in
            audit|apply|apply-catchup-0050-0053) ;;
            *)
              echo "Unsupported mode: $MODE"
              exit 1
              ;;
          esac
          PROVIDED=0
          TOTAL=0
          for VALUE in "$SCHEMA_APPLY_RUN_ID" "$SCHEMA_APPLY_RUN_ATTEMPT" "$SCHEMA_APPLY_ARTIFACT_ID" "$SCHEMA_APPLY_ARTIFACT_DIGEST" "$SCHEMA_APPLY_RECEIPT_FILE_SHA256" "$SCHEMA_PRECURSOR_SHA"; do
            TOTAL=$((TOTAL + 1))
            if [ -n "$VALUE" ]; then
              PROVIDED=$((PROVIDED + 1))
            fi
          done
          if [ "$PROVIDED" -ne 0 ] && [ "$PROVIDED" -ne "$TOTAL" ]; then
            echo "Historical schema apply identity requires all six inputs or none."
            exit 1
          fi
          if [ "$PROVIDED" -ne 0 ] && [ "$MODE" != "audit" ]; then
            echo "Historical schema apply proof is only valid in audit mode."
            exit 1
          fi

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 0

      - name: Verify expected commit SHA
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          ACTUAL_SHA="$(git rev-parse HEAD)"
          if [ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "Production reconciliation must run from the default branch."
            exit 1
          fi
          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ] || [ "$GITHUB_SHA" != "$EXPECTED_SHA" ]; then
            echo "Checked-out SHA does not match expected_sha."
            exit 1
          fi

      - name: Setup Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          cache: 'npm'

      - name: Align npm with packageManager
        run: npm install -g npm@10.9.2

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Require first apply attempt
        if: startsWith(inputs.mode, 'apply')
        run: |
          set -euo pipefail
          if [ "$GITHUB_RUN_ATTEMPT" != "1" ]; then
            echo "Schema apply is only permitted on workflow attempt 1."
            exit 1
          fi

      - name: Verify artifact retention before apply
        if: startsWith(inputs.mode, 'apply')
        env:
          SCHEMA_EVIDENCE_RETENTION_READ_TOKEN: ${{ secrets.SCHEMA_EVIDENCE_RETENTION_READ_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "$SCHEMA_EVIDENCE_RETENTION_READ_TOKEN" ]; then
            echo "SCHEMA_EVIDENCE_RETENTION_READ_TOKEN is required for apply mode."
            exit 1
          fi
          echo "::add-mask::$SCHEMA_EVIDENCE_RETENTION_READ_TOKEN"
          retention_response_file="$(mktemp)"
          auth_header_file="$(mktemp)"
          chmod 600 "$auth_header_file"
          trap 'rm -f "$retention_response_file" "$auth_header_file"' EXIT
          # Keep the token out of process argv: pass the Authorization header
          # through a 0600 header file instead of a command-line argument.
          printf 'header "Authorization: Bearer %s"\n' "$SCHEMA_EVIDENCE_RETENTION_READ_TOKEN" > "$auth_header_file"
          status="$(curl --silent --show-error \
            --output "$retention_response_file" \
            --write-out '%{http_code}' \
            --header "Accept: application/vnd.github+json" \
            --config "$auth_header_file" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/actions/permissions/artifact-and-log-retention")"
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "Artifact retention policy lookup failed before apply."
            exit 1
          fi
          days="$(node - "$retention_response_file" <<'NODE'
          const fs = require('node:fs');
          const file = process.argv[2];
          let body;
          try {
            body = JSON.parse(fs.readFileSync(file, 'utf8'));
          } catch {
            process.exit(1);
          }
          if (!Number.isSafeInteger(body?.days) || body.days < 90) process.exit(1);
          process.stdout.write(String(body.days));
          NODE
          )" || {
            echo "Artifact retention policy response is malformed or shorter than 90 days."
            exit 1
          }
          echo "Artifact retention policy permits $days days."

      # Historical schema apply proof (audit mode with all six identity inputs).
      # Caller-supplied URLs or prose references are never accepted as schema
      # proof: the exact run and artifact are fetched by ID and re-verified.
      - name: Verify historical schema apply run identity
        if: ${{ inputs.mode == 'audit' && inputs.schema_apply_run_id != '' }}
        id: historical_run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SCHEMA_APPLY_RUN_ID: ${{ inputs.schema_apply_run_id }}
          SCHEMA_APPLY_RUN_ATTEMPT: ${{ inputs.schema_apply_run_attempt }}
          SCHEMA_APPLY_ARTIFACT_ID: ${{ inputs.schema_apply_artifact_id }}
          SCHEMA_APPLY_ARTIFACT_DIGEST: ${{ inputs.schema_apply_artifact_digest }}
          SCHEMA_APPLY_RECEIPT_FILE_SHA256: ${{ inputs.schema_apply_receipt_file_sha256 }}
          SCHEMA_PRECURSOR_SHA: ${{ inputs.schema_precursor_sha }}
        run: |
          set -euo pipefail
          if [[ ! "$SCHEMA_APPLY_RUN_ID" =~ ^[1-9][0-9]{0,31}$ ]]; then
            echo "::error::schema_apply_run_id must be a positive decimal ID."
            exit 1
          fi
          if [[ "$SCHEMA_APPLY_RUN_ATTEMPT" != "1" ]]; then
            echo "::error::Historical schema apply proof requires attempt exactly 1."
            exit 1
          fi
          if [[ ! "$SCHEMA_APPLY_ARTIFACT_ID" =~ ^[1-9][0-9]{0,31}$ ]]; then
            echo "::error::schema_apply_artifact_id must be a positive decimal ID."
            exit 1
          fi
          if [[ ! "$SCHEMA_APPLY_ARTIFACT_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "::error::schema_apply_artifact_digest must be a canonical sha256: digest."
            exit 1
          fi
          if [[ ! "$SCHEMA_APPLY_RECEIPT_FILE_SHA256" =~ ^[a-f0-9]{64}$ ]]; then
            echo "::error::schema_apply_receipt_file_sha256 must be lowercase 64-hex."
            exit 1
          fi
          if [[ ! "$SCHEMA_PRECURSOR_SHA" =~ ^[a-f0-9]{40}$ ]]; then
            echo "::error::schema_precursor_sha must be a lowercase 40-hex SHA."
            exit 1
          fi
          gh api "repos/${REPO}/actions/runs/${SCHEMA_APPLY_RUN_ID}" > "$RUNNER_TEMP/historical-apply-run.json"
          node <<'NODE'
          const fs = require('node:fs');
          const run = JSON.parse(
            fs.readFileSync(`${process.env.RUNNER_TEMP}/historical-apply-run.json`, 'utf8')
          );
          const htmlUrl = String(run.html_url ?? '');
          const validHtmlUrl =
            htmlUrl.startsWith('https://github.com/') &&
            htmlUrl.includes(`/actions/runs/${process.env.SCHEMA_APPLY_RUN_ID}`);
          const valid =
            String(run.id) === process.env.SCHEMA_APPLY_RUN_ID &&
            run.repository?.full_name === process.env.REPO &&
            run.event === 'workflow_dispatch' &&
            run.path === '.github/workflows/prod-schema-reconcile.yml' &&
            run.conclusion === 'success' &&
            run.run_attempt === 1 &&
            run.head_sha === process.env.SCHEMA_PRECURSOR_SHA &&
            validHtmlUrl;
          if (!valid) {
            console.error('Historical schema apply run does not match the recorded identity.');
            process.exit(1);
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `apply_run_url=${htmlUrl}\n`);
          NODE

      - name: Verify and download historical schema apply artifact by exact ID
        if: ${{ inputs.mode == 'audit' && inputs.schema_apply_run_id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SCHEMA_APPLY_RUN_ID: ${{ inputs.schema_apply_run_id }}
          SCHEMA_APPLY_ARTIFACT_ID: ${{ inputs.schema_apply_artifact_id }}
          SCHEMA_APPLY_ARTIFACT_DIGEST: ${{ inputs.schema_apply_artifact_digest }}
          SCHEMA_APPLY_RECEIPT_FILE_SHA256: ${{ inputs.schema_apply_receipt_file_sha256 }}
          SCHEMA_PRECURSOR_SHA: ${{ inputs.schema_precursor_sha }}
        run: |
          set -euo pipefail
          gh api "repos/${REPO}/actions/artifacts/${SCHEMA_APPLY_ARTIFACT_ID}" > "$RUNNER_TEMP/historical-apply-artifact.json"
          node <<'NODE'
          const fs = require('node:fs');
          const artifact = JSON.parse(
            fs.readFileSync(`${process.env.RUNNER_TEMP}/historical-apply-artifact.json`, 'utf8')
          );
          const expectedName = `prod-schema-reconcile-${process.env.SCHEMA_APPLY_RUN_ID}-1-apply-${process.env.SCHEMA_PRECURSOR_SHA}`;
          const valid =
            String(artifact.id) === process.env.SCHEMA_APPLY_ARTIFACT_ID &&
            String(artifact.workflow_run?.id) === process.env.SCHEMA_APPLY_RUN_ID &&
            artifact.expired === false &&
            artifact.name === expectedName &&
            artifact.digest === process.env.SCHEMA_APPLY_ARTIFACT_DIGEST;
          if (!valid) {
            console.error('Historical schema apply artifact does not match the recorded identity.');
            process.exit(1);
          }
          NODE
          EVIDENCE_DIR="$RUNNER_TEMP/historical-apply-evidence"
          rm -rf -- "$EVIDENCE_DIR"
          mkdir -m 0700 -- "$EVIDENCE_DIR"
          gh api "repos/${REPO}/actions/artifacts/${SCHEMA_APPLY_ARTIFACT_ID}/zip" > "$EVIDENCE_DIR/archive.zip"
          RECOMPUTED_ARCHIVE_SHA256="$(sha256sum "$EVIDENCE_DIR/archive.zip" | cut -d' ' -f1)"
          if [ "sha256:${RECOMPUTED_ARCHIVE_SHA256}" != "$SCHEMA_APPLY_ARTIFACT_DIGEST" ]; then
            echo "::error::Recomputed archive SHA-256 does not equal the recorded artifact digest."
            exit 1
          fi
          zipinfo -1 "$EVIDENCE_DIR/archive.zip" | LC_ALL=C sort > "$EVIDENCE_DIR/entries.txt"
          printf '%s\n' \
            'apply.txt' \
            'lock-time-apply-vector.json' \
            'post-apply-audit.txt' \
            'pre-apply-audit.txt' \
            'schema-reconcile-receipt.json' \
            | LC_ALL=C sort > "$EVIDENCE_DIR/expected-entries.txt"
          if ! diff -u "$EVIDENCE_DIR/expected-entries.txt" "$EVIDENCE_DIR/entries.txt"; then
            echo "::error::Historical apply archive contains unknown, missing, or traversal entries."
            exit 1
          fi
          unzip -o "$EVIDENCE_DIR/archive.zip" -d "$EVIDENCE_DIR/extracted"
          if find "$EVIDENCE_DIR/extracted" -type l | grep -q .; then
            echo "::error::Historical apply archive contains symlinks."
            exit 1
          fi
          if [ "$(find "$EVIDENCE_DIR/extracted" -type f | wc -l)" -ne 5 ]; then
            echo "::error::Historical apply archive extracted an unexpected file count."
            exit 1
          fi
          RECEIPT_PATH="$EVIDENCE_DIR/extracted/schema-reconcile-receipt.json"
          RECOMPUTED_RECEIPT_SHA256="$(sha256sum "$RECEIPT_PATH" | cut -d' ' -f1)"
          if [ "$RECOMPUTED_RECEIPT_SHA256" != "$SCHEMA_APPLY_RECEIPT_FILE_SHA256" ]; then
            echo "::error::Recomputed receipt SHA-256 does not equal the recorded receipt hash."
            exit 1
          fi
          # Workspace-resident helper: relative contract imports must resolve
          # against the checkout, never RUNNER_TEMP.
          cat > ./validate-historical-receipt.tmp.mts <<'VALIDATE'
          import { readFile } from 'node:fs/promises';
          import { SchemaReconcileReceiptV1Schema } from './shared/contracts/schema-reconcile-receipt-v1.contract';

          const raw: unknown = JSON.parse(
            await readFile(process.env['RECEIPT_PATH'] as string, 'utf8')
          );
          const receipt = SchemaReconcileReceiptV1Schema.parse(raw);
          if (receipt.runId !== process.env['SCHEMA_APPLY_RUN_ID']) {
            throw new Error('Receipt run ID does not match the recorded apply run');
          }
          if (receipt.sourceSha !== process.env['SCHEMA_PRECURSOR_SHA']) {
            throw new Error('Receipt source SHA does not match the recorded precursor');
          }
          if (receipt.manifest !== '30-g3-release-gate-hardening' || receipt.migration !== '0053') {
            throw new Error('Receipt does not bind the 0053 release-gate-hardening manifest');
          }
          if (receipt.preDecision !== 'APPLY-MISSING-DDL' || receipt.postDecision !== 'SKIP') {
            throw new Error('Receipt does not prove the APPLY-MISSING-DDL to SKIP transition');
          }
          VALIDATE
          RECEIPT_PATH="$RECEIPT_PATH" npx tsx ./validate-historical-receipt.tmp.mts
          rm -f ./validate-historical-receipt.tmp.mts

      - name: Run pre-apply audit
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: |
          mkdir -p reports
          set +e
          node scripts/reconcile-prod-schema.mjs > reports/pre-apply-audit.raw 2>&1
          STATUS=$?
          set -e
          sed -E \
            -e 's/^Target database: .* user=.*/Target database: [REDACTED] user=[REDACTED]/' \
            -e 's#postgres(ql)?://[^[:space:]]+#[REDACTED_DATABASE_URL]#g' \
            reports/pre-apply-audit.raw > reports/pre-apply-audit.txt
          rm reports/pre-apply-audit.raw
          exit "$STATUS"

      - name: Require clean production schema audit
        if: inputs.mode == 'audit'
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          const manifestDir = 'scripts/prod-schema-manifests';
          const manifests = fs
            .readdirSync(manifestDir)
            .filter((file) => file.endsWith('.json'))
            .map((file) => JSON.parse(fs.readFileSync(path.join(manifestDir, file), 'utf8')));
          const report = fs.readFileSync('reports/pre-apply-audit.txt', 'utf8');
          const decisionPattern =
            /^([^\s:][^:]*): (SKIP|APPLY-MISSING-DDL|REFUSE-FOR-HUMAN) \(missingTablePolicy=[^)]+\)$/gm;
          const decisions = [...report.matchAll(decisionPattern)].map((match) => ({
            manifest: match[1],
            action: match[2],
          }));
          const clean =
            decisions.length === manifests.length &&
            manifests.every(
              ({ name }) =>
                decisions.filter(
                  (decision) => decision.manifest === name && decision.action === 'SKIP'
                ).length === 1
            );
          if (!clean) {
            console.error('Production schema audit found drift; deployment promotion is blocked.');
            process.exit(1);
          }
          console.log('Production schema audit is clean.');
          NODE

      - name: Build and upload schema evidence fragment
        if: ${{ inputs.mode == 'audit' && inputs.schema_apply_run_id != '' }}
        id: build_schema_fragment
        env:
          GITHUB_SERVER_URL: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          FRAGMENT_SOURCE_SHA: ${{ inputs.expected_sha }}
          SCHEMA_APPLY_RUN_ID: ${{ inputs.schema_apply_run_id }}
          SCHEMA_APPLY_ARTIFACT_ID: ${{ inputs.schema_apply_artifact_id }}
          SCHEMA_APPLY_ARTIFACT_DIGEST: ${{ inputs.schema_apply_artifact_digest }}
          SCHEMA_APPLY_RECEIPT_FILE_SHA256: ${{ inputs.schema_apply_receipt_file_sha256 }}
          SCHEMA_PRECURSOR_SHA: ${{ inputs.schema_precursor_sha }}
          APPLY_RUN_URL: ${{ steps.historical_run.outputs.apply_run_url }}
        run: |
          set -euo pipefail
          : "${APPLY_RUN_URL:?APPLY_RUN_URL is required}"
          node <<'NODE'
          const fs = require('node:fs');
          const digest = process.env.SCHEMA_APPLY_ARTIFACT_DIGEST.replace(/^sha256:/, '');
          const payload = {
            migration: '0053',
            precursorSha: process.env.SCHEMA_PRECURSOR_SHA,
            apply: {
              runId: process.env.SCHEMA_APPLY_RUN_ID,
              runAttempt: 1,
              workflowPath: '.github/workflows/prod-schema-reconcile.yml',
              sourceSha: process.env.SCHEMA_PRECURSOR_SHA,
              runUrl: process.env.APPLY_RUN_URL,
              artifactId: process.env.SCHEMA_APPLY_ARTIFACT_ID,
              artifactName: `prod-schema-reconcile-${process.env.SCHEMA_APPLY_RUN_ID}-1-apply-${process.env.SCHEMA_PRECURSOR_SHA}`,
              artifactArchiveSha256: digest,
              receiptFileSha256: process.env.SCHEMA_APPLY_RECEIPT_FILE_SHA256,
            },
            audit: {
              runId: process.env.GITHUB_RUN_ID,
              runAttempt: Number(process.env.GITHUB_RUN_ATTEMPT),
              workflowPath: '.github/workflows/prod-schema-reconcile.yml',
              sourceSha: process.env.FRAGMENT_SOURCE_SHA,
              runUrl: `${process.env.GITHUB_SERVER_URL}/${process.env.REPO}/actions/runs/${process.env.GITHUB_RUN_ID}`,
              result: 'clean',
            },
          };
          fs.writeFileSync(`${process.env.RUNNER_TEMP}/schema-fragment-payload.json`, JSON.stringify(payload), { mode: 0o600 });
          NODE
          BUILD_OUTPUT="$(npx tsx scripts/release/build-release-evidence-fragment.ts \
            --kind schema \
            --payload-file "$RUNNER_TEMP/schema-fragment-payload.json" \
            --producer-job schema-audit \
            --output "$RUNNER_TEMP/release-evidence-fragment-schema.json")"
          node -e '
            const parsed = JSON.parse(process.argv[1]);
            const hex = /^[a-f0-9]{64}$/;
            if (!hex.test(parsed.payloadSha256) || !hex.test(parsed.fileSha256)) {
              console.error("Schema fragment builder emitted an invalid result.");
              process.exit(1);
            }
            const fs = require("node:fs");
            fs.appendFileSync(process.env.GITHUB_OUTPUT, "payload_sha256=" + parsed.payloadSha256 + "\n");
            fs.appendFileSync(process.env.GITHUB_OUTPUT, "file_sha256=" + parsed.fileSha256 + "\n");
          ' "$BUILD_OUTPUT"

      - name: Name attempt-qualified schema fragment artifact
        if: ${{ inputs.mode == 'audit' && inputs.schema_apply_run_id != '' }}
        id: schema_fragment_meta
        env:
          FRAGMENT_SOURCE_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          echo "artifact_name=release-evidence-fragment-v1-schema-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${FRAGMENT_SOURCE_SHA}" >> "$GITHUB_OUTPUT"

      - name: Upload immutable schema evidence fragment
        if: ${{ inputs.mode == 'audit' && inputs.schema_apply_run_id != '' }}
        id: upload_schema_fragment
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.schema_fragment_meta.outputs.artifact_name }}
          path: ${{ runner.temp }}/release-evidence-fragment-schema.json
          retention-days: 30
          if-no-files-found: error

      - name: Remove historical apply evidence
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/historical-apply-evidence" "$RUNNER_TEMP/historical-apply-run.json" "$RUNNER_TEMP/historical-apply-artifact.json" "$RUNNER_TEMP/schema-fragment-payload.json" "$RUNNER_TEMP/release-evidence-fragment-schema.json" ./validate-historical-receipt.tmp.mts

      - name: Require additive-safe apply decision
        if: startsWith(inputs.mode, 'apply')
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import { assertApplyPolicyForManifests } from './scripts/prod-schema-apply-policy.mjs';

          const manifestDir = 'scripts/prod-schema-manifests';
          const manifests = fs
            .readdirSync(manifestDir)
            .filter((file) => file.endsWith('.json'))
            .map((file) => JSON.parse(fs.readFileSync(path.join(manifestDir, file), 'utf8')));
          const report = fs.readFileSync('reports/pre-apply-audit.txt', 'utf8');
          const decisionPattern =
            /^([^\s:][^:]*): (SKIP|APPLY-MISSING-DDL|REFUSE-FOR-HUMAN) \(missingTablePolicy=[^)]+\)$/gm;
          const decisions = [...report.matchAll(decisionPattern)].map((match) => ({
            manifest: match[1],
            action: match[2],
          }));

          const fail = (message) => {
            console.error(message);
            process.exit(1);
          };
          if (
            decisions.length !== manifests.length ||
            manifests.some(
              ({ name }) => decisions.filter((decision) => decision.manifest === name).length !== 1
            )
          ) {
            fail('Pre-apply audit did not contain exactly one recognized decision per manifest.');
          }
          if (decisions.some(({ action }) => action === 'REFUSE-FOR-HUMAN')) {
            fail('Pre-apply audit requires human review; apply is blocked.');
          }
          if (!decisions.some(({ action }) => action === 'APPLY-MISSING-DDL')) {
            fail('Pre-apply audit did not report additive-safe work to apply.');
          }

          const applyingManifests = new Set(
            decisions
              .filter(({ action }) => action === 'APPLY-MISSING-DDL')
              .map(({ manifest }) => manifest)
          );
          try {
            assertApplyPolicyForManifests({
              manifests,
              applyingManifestNames: applyingManifests,
            });
          } catch (error) {
            fail(error instanceof Error ? error.message : String(error));
          }

          const escapeRegExp = (value) => value.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
          const dropDecisions = manifests.flatMap((manifest) =>
            (manifest.dropObjects ?? []).map((drop) => {
              const objectLabel = drop.table ?? drop.name;
              const dropDecisionPattern = new RegExp(
                `^  ${escapeRegExp(objectLabel)}: (SKIP \\(shape-ok\\)|APPLY-MISSING-DDL \\(${escapeRegExp(drop.name)}\\))$`,
                'gm'
              );
              const matches = [...report.matchAll(dropDecisionPattern)];
              if (matches.length !== 1) {
                fail('Pre-apply audit did not contain exactly one recognized decision per dropObject.');
              }
              return matches[0][1].startsWith('APPLY-MISSING-DDL') ? 'APPLY' : 'SKIP';
            })
          );
          if (dropDecisions.includes('APPLY')) {
            fail('Pre-apply audit contains destructive dropObjects; apply is blocked.');
          }
          NODE

      - name: Apply additive-safe reconciliation
        id: apply
        if: ${{ startsWith(inputs.mode, 'apply') }}
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          MODE: ${{ inputs.mode }}
        run: |
          set +e
          if [ "$MODE" = "apply-catchup-0050-0053" ]; then
            node scripts/reconcile-prod-schema.mjs --apply --yes --apply-g3-catchup-0050-0053 > reports/apply.raw 2>&1
            STATUS=$?
          elif [ "$MODE" = "apply" ]; then
            node scripts/reconcile-prod-schema.mjs --apply --yes --apply-0053-g3-release-gate-hardening > reports/apply.raw 2>&1
            STATUS=$?
          else
            echo "Unsupported apply mode: $MODE" > reports/apply.raw
            STATUS=1
          fi
          set -e
          sed -E \
            -e 's/^Target database: .* user=.*/Target database: [REDACTED] user=[REDACTED]/' \
            -e 's#postgres(ql)?://[^[:space:]]+#[REDACTED_DATABASE_URL]#g' \
            reports/apply.raw > reports/apply.txt
          rm reports/apply.raw
          exit "$STATUS"

      - name: Validate lock-time apply vector
        if: ${{ startsWith(inputs.mode, 'apply') && steps.apply.outcome == 'success' }}
        env:
          MODE: ${{ inputs.mode }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import process from 'node:process';
          import {
            loadManifests,
            parseAuditDecisionLines,
            parseG3CatchupLockTimeApplyVectorV1,
            parseLockTimeApplyVectorV1,
            prepare0053G3ReleaseGateHardeningCapability,
            prepareG3Catchup0050To0053Capability,
          } from './scripts/reconcile-prod-schema.mjs';

          const preparedManifests = (await loadManifests()).map((manifest) => ({ manifest }));
          const report = fs.readFileSync('reports/apply.txt', 'utf8');
          let vector;
          if (process.env.MODE === 'apply-catchup-0050-0053') {
            const capability = await prepareG3Catchup0050To0053Capability();
            const targetNames = new Set(capability.targets.map((target) => target.manifestName));
            const expectedTargetActions = parseAuditDecisionLines(
              fs.readFileSync('reports/pre-apply-audit.txt', 'utf8')
            ).filter((decision) => targetNames.has(decision.manifest));
            vector = parseG3CatchupLockTimeApplyVectorV1(report, {
              preparedManifests,
              capability,
              expectedTargetActions,
            });
          } else if (process.env.MODE === 'apply') {
            vector = parseLockTimeApplyVectorV1(report, {
              preparedManifests,
              target: await prepare0053G3ReleaseGateHardeningCapability(),
            });
          } else {
            throw new Error(`Unsupported apply mode: ${process.env.MODE}`);
          }
          fs.writeFileSync('reports/lock-time-apply-vector.json', JSON.stringify(vector));
          NODE

      - name: Run post-apply audit
        id: post_audit
        if: ${{ !cancelled() && startsWith(inputs.mode, 'apply') && (steps.apply.outcome == 'success' || steps.apply.outcome == 'failure') }}
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: |
          set +e
          node scripts/reconcile-prod-schema.mjs > reports/post-apply-audit.raw 2>&1
          STATUS=$?
          set -e
          sed -E \
            -e 's/^Target database: .* user=.*/Target database: [REDACTED] user=[REDACTED]/' \
            -e 's#postgres(ql)?://[^[:space:]]+#[REDACTED_DATABASE_URL]#g' \
            reports/post-apply-audit.raw > reports/post-apply-audit.txt
          rm reports/post-apply-audit.raw
          exit "$STATUS"

      - name: Require clean post-apply audit
        id: require_post_apply_clean
        if: ${{ !cancelled() && startsWith(inputs.mode, 'apply') && (steps.post_audit.outcome == 'success' || steps.post_audit.outcome == 'failure') }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          const manifestDir = 'scripts/prod-schema-manifests';
          const manifests = fs
            .readdirSync(manifestDir)
            .filter((file) => file.endsWith('.json'))
            .map((file) => JSON.parse(fs.readFileSync(path.join(manifestDir, file), 'utf8')));
          const report = fs.readFileSync('reports/post-apply-audit.txt', 'utf8');
          const decisionPattern =
            /^([^\s:][^:]*): (SKIP|APPLY-MISSING-DDL|REFUSE-FOR-HUMAN) \(missingTablePolicy=[^)]+\)$/gm;
          const decisions = [...report.matchAll(decisionPattern)].map((match) => ({
            manifest: match[1],
            action: match[2],
          }));
          const complete =
            decisions.length === manifests.length &&
            manifests.every(
              ({ name }) =>
                decisions.filter(
                  (decision) => decision.manifest === name && decision.action === 'SKIP'
                ).length === 1
            );
          if (!complete) {
            console.error('Post-apply audit did not report exactly one clean decision per manifest.');
            process.exit(1);
          }
          NODE

      - name: Build schema reconcile receipt
        if: ${{ startsWith(inputs.mode, 'apply') && steps.apply.outcome == 'success' && steps.post_audit.outcome == 'success' && steps.require_post_apply_clean.outcome == 'success' }}
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          SCHEMA_RECONCILE_SOURCE_SHA: ${{ inputs.expected_sha }}
          SCHEMA_RECONCILE_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          if [ "$SCHEMA_RECONCILE_MODE" = "apply-catchup-0050-0053" ]; then
            if ! grep -Eq '^g3-(portfolio-and-calculation|canary|capital-call-notification-outbox|release-gate-hardening): APPLY-MISSING-DDL ' reports/pre-apply-audit.txt; then
              echo "Catch-up receipt requires at least one APPLY-MISSING-DDL predecision."
              exit 1
            fi
          else
            if ! grep -Eq '^g3-release-gate-hardening: APPLY-MISSING-DDL ' reports/pre-apply-audit.txt; then
              echo "Apply receipt requires an APPLY-MISSING-DDL predecision."
              exit 1
            fi
          fi
          npx tsx scripts/release/build-schema-reconcile-receipt.ts \
            --output reports/schema-reconcile-receipt.json

      - name: Require schema reconcile receipt after successful apply
        if: ${{ startsWith(inputs.mode, 'apply') && steps.apply.outcome == 'success' && steps.post_audit.outcome == 'success' && steps.require_post_apply_clean.outcome == 'success' }}
        run: test -s reports/schema-reconcile-receipt.json

      - name: Upload redacted reconciliation reports
        id: upload_evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: prod-schema-reconcile-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.mode }}-${{ inputs.expected_sha }}
          path: |
            reports/*.txt
            reports/lock-time-apply-vector.json
            reports/schema-reconcile-receipt.json
          if-no-files-found: error
          retention-days: 90

      - name: Capture apply evidence identity
        if: ${{ always() && startsWith(inputs.mode, 'apply') && steps.apply.outcome == 'success' && steps.post_audit.outcome == 'success' && steps.require_post_apply_clean.outcome == 'success' }}
        env:
          ARTIFACT_ID: ${{ steps.upload_evidence.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload_evidence.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          if [ -z "$ARTIFACT_ID" ] || [ -z "$ARTIFACT_DIGEST" ]; then
            echo "Successful apply evidence is missing artifact identity outputs."
            exit 1
          fi
          RECEIPT_SHA256="$(sha256sum reports/schema-reconcile-receipt.json | awk '{print $1}')"
          {
            echo "Schema evidence artifact ID: $ARTIFACT_ID"
            echo "Schema evidence artifact digest: $ARTIFACT_DIGEST"
            echo "Schema reconcile receipt SHA-256: $RECEIPT_SHA256"
          } >> "$GITHUB_STEP_SUMMARY"
