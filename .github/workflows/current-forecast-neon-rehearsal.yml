name: Current Forecast Neon Rehearsal

on:
  workflow_dispatch:
    inputs:
      expected_sha: { description: Exact admitted main SHA, required: true, type: string }
      project_id: { description: Exact Neon project ID, required: true, type: string }
      parent_branch_id: { description: Exact Neon parent branch ID, required: true, type: string }
      database_name: { description: Exact database name, required: true, type: string }
      migration_mode:
        description: Bounded migration capability; 0056 and 0057 require separate authoritative prerequisite sources
        required: true
        type: choice
        options:
          [
            current-forecast-0050-0055,
            actuals-draft-0056,
            actuals-restatement-0057,
            journaled-0050-0061,
            journaled-0062,
          ]
        default: current-forecast-0050-0055
      expected_parent_migration_tail:
        description: Expected parent Drizzle tail
        required: true
        type: choice
        options:
          [
            0049_kpi_observations,
            0053_g3_release_gate_hardening,
            0055_current_forecast_recompute_commands,
            0056_actuals_draft_revisions,
            0061_durable_create_receipts,
          ]

permissions:
  contents: read

concurrency:
  group: current-forecast-neon-${{ inputs.project_id }}-${{ inputs.parent_branch_id }}
  cancel-in-progress: false
  queue: max

jobs:
  rehearse:
    if: ${{ github.run_attempt == 1 }}
    environment: production-schema
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with: { ref: '${{ inputs.expected_sha }}', fetch-depth: 0 }
      - name: Fence live main
        env: { EXPECTED_SHA: '${{ inputs.expected_sha }}' }
        run: |
          git fetch origin refs/heads/main
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: ./.github/actions/setup-node-env
      - name: Require owner 0062 rehearsal on isolated target
        if: inputs.migration_mode == 'journaled-0062'
        env:
          REPOSITORY_OWNER_ID: ${{ github.repository_owner_id }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          PROJECT_ID: ${{ inputs.project_id }}
          PARENT_BRANCH_ID: ${{ inputs.parent_branch_id }}
          DATABASE_NAME: ${{ inputs.database_name }}
          ALLOWED_PROJECT_ID: ${{ vars.SCHEMA_0062_REHEARSAL_PROJECT_ID }}
          ALLOWED_PARENT_BRANCH_ID: ${{ vars.SCHEMA_0062_REHEARSAL_PARENT_BRANCH_ID }}
          ALLOWED_DATABASE_NAME: ${{ vars.SCHEMA_0062_REHEARSAL_DATABASE_NAME }}
          PRODUCTION_PROJECT_ID: ${{ secrets.ACTUALS_PREFLIGHT_NEON_PROJECT_ID }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
          test -n "$REPOSITORY_OWNER_ID"
          test "$GITHUB_ACTOR_ID" = "$REPOSITORY_OWNER_ID"
          test "$GITHUB_ACTOR" = "$GITHUB_TRIGGERING_ACTOR"
          test -n "$PRODUCTION_PROJECT_ID"
          test -n "$PROJECT_ID"
          test "$PROJECT_ID" != "$PRODUCTION_PROJECT_ID"
          test "$PROJECT_ID" = "$ALLOWED_PROJECT_ID"
          test -n "$PARENT_BRANCH_ID"
          test "$PARENT_BRANCH_ID" = "$ALLOWED_PARENT_BRANCH_ID"
          test -n "$DATABASE_NAME"
          test "$DATABASE_NAME" = "$ALLOWED_DATABASE_NAME"
          git fetch origin refs/heads/main
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_SHA"

      - name: Rehearse bounded migration and tests
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          NEON_PROJECT_ID: ${{ inputs.project_id }}
          NEON_PARENT_BRANCH_ID: ${{ inputs.parent_branch_id }}
          NEON_DATABASE_NAME: ${{ inputs.database_name }}
          EXPECTED_PARENT_MIGRATION_TAIL: ${{ inputs.expected_parent_migration_tail }}
          ACTUALS_MIGRATION_REHEARSAL_MODE: ${{ inputs.migration_mode }}
        run: node scripts/release/rehearse-current-forecast-neon.mjs

      - name: Upload exact 0062 rehearsal evidence
        if: inputs.migration_mode == 'journaled-0062'
        uses: actions/upload-artifact@v7
        with:
          name: journaled-0062-rehearsal-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.expected_sha }}
          path: ${{ runner.temp }}/journaled-0062-rehearsal.json
          if-no-files-found: error
          retention-days: 7
